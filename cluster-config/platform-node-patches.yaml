# =============================================================================
# PLATFORM NODE PATCHES
# =============================================================================
# Patches ArgoCD, Kyverno, and ExternalSecrets deployments/statefulsets
# to run on the platform node group (node-group=platform).
#
# The platform node has taint: dedicated=platform:NoSchedule
# These patches add:
#   nodeSelector: node-group=platform
#   tolerations: dedicated=platform:NoSchedule
#
# This ensures all platform components are isolated from app (vendure) pods.
# When vendure OOMs, it cannot affect ArgoCD, Kyverno, or ExternalSecrets.
# =============================================================================

# --- ArgoCD Application Controller (StatefulSet) ---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: argocd-application-controller
  namespace: argocd
spec:
  template:
    spec:
      nodeSelector:
        node-group: platform
      tolerations:
        - key: dedicated
          value: platform
          effect: NoSchedule
---
