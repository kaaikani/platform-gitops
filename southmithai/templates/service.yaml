{{- if .Values.app.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "southmithai.fullname" . }}
  labels:
    {{- include "southmithai.labels" . | nindent 4 }}
    app.kubernetes.io/component: southmithai
spec:
  type: {{ .Values.app.service.type }}
  ports:
    - name: http
      port: {{ .Values.app.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "southmithai.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: southmithai
{{- end }}
