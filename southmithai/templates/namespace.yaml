{{- if .Values.namespace.create }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.namespace.name | default .Release.Namespace }}
  labels:
    {{- include "southmithai.labels" . | nindent 4 }}
    {{- if .Values.namespace.podSecurity.enforce }}
    pod-security.kubernetes.io/enforce: {{ .Values.namespace.podSecurity.enforce }}
    {{- end }}
    {{- if .Values.namespace.podSecurity.audit }}
    pod-security.kubernetes.io/audit: {{ .Values.namespace.podSecurity.audit }}
    {{- end }}
    {{- if .Values.namespace.podSecurity.warn }}
    pod-security.kubernetes.io/warn: {{ .Values.namespace.podSecurity.warn }}
    {{- end }}
{{- end }}
