name: Outage Detector

# Runs OUTSIDE AWS (GitHub) because a watchman inside the building it guards is
# useless -- prod's Prometheus/Grafana/Alertmanager all die with the region.
#
# CRITICAL DESIGN POINT (user's insight, 2026-08-05): a plain "site is down"
# alarm is WORSE than nothing. It fires on every bad deploy (1+/day here), you
# learn to ignore it, and then you miss the real one -- or worse, someone
# triggers a DR failover for something `git revert` fixes in 3 minutes.
# So we check the APP and the INFRASTRUCTURE separately and classify:
#
#   app down + AWS infra healthy      -> DEPLOY problem. Roll back. NOT DR.
#   app down + AWS infra unreachable  -> possible REGIONAL event. Human decides.
#
# Every 10 min (~144 runs/mo, ~40s each = ~100 of the 2000 free minutes).
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read
  issues: write

env:
  AWS_REGION: ap-south-1
  TF_ROLE_ARN: arn:aws:iam::149536454380:role/github-actions-terraform

jobs:
  detect:
    runs-on: ubuntu-latest
    steps:
      - name: Probe the app (twice, 60s apart -- ignore transient blips)
        id: app
        run: |
          probe() {
            a=$(curl -s -o /dev/null -m 20 -w '%{http_code}' https://kaaikani.co.in/health || echo 000)
            b=$(curl -s -o /dev/null -m 20 -L -w '%{http_code}' https://kaaikanistore.com/ || echo 000)
            echo "$a $b"
          }
          read A1 B1 <<< "$(probe)"
          echo "probe1: health=$A1 store=$B1"
          if [ "$A1" = "200" ]; then echo "down=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          sleep 60
          read A2 B2 <<< "$(probe)"
          echo "probe2: health=$A2 store=$B2"
          if [ "$A2" = "200" ]; then echo "down=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "down=true" >> "$GITHUB_OUTPUT"
          echo "detail=health=$A2 storefront=$B2" >> "$GITHUB_OUTPUT"

      # Only reached when the app is down twice in a row.
      - uses: aws-actions/configure-aws-credentials@v4
        if: steps.app.outputs.down == 'true'
        continue-on-error: true # AWS itself may be the thing that is broken
        id: creds
        with:
          role-to-assume: ${{ env.TF_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Classify — is AWS infrastructure alive?
        if: steps.app.outputs.down == 'true'
        id: infra
        run: |
          set +e
          EKS=$(aws eks describe-cluster --name vendure-prod-cluster --query 'cluster.status' --output text 2>&1)
          RDS=$(aws rds describe-db-instances --db-instance-identifier vendure-prod-db \
                 --query 'DBInstances[0].DBInstanceStatus' --output text 2>&1)
          ALB=$(aws elbv2 describe-load-balancers --query 'LoadBalancers[0].State.Code' --output text 2>&1)
          echo "EKS=$EKS RDS=$RDS ALB=$ALB"
          {
            echo "eks=$EKS"; echo "rds=$RDS"; echo "alb=$ALB"
          } >> "$GITHUB_OUTPUT"
          # Infra counts as ALIVE only if all three answer normally
          if [ "$EKS" = "ACTIVE" ] && [ "$RDS" = "available" ] && [ "$ALB" = "active" ]; then
            echo "verdict=DEPLOY" >> "$GITHUB_OUTPUT"
          else
            echo "verdict=REGIONAL" >> "$GITHUB_OUTPUT"
          fi

      - name: 🟡 App down, infrastructure healthy — deploy problem
        if: steps.app.outputs.down == 'true' && steps.infra.outputs.verdict == 'DEPLOY'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "🟡 App down — AWS is FINE, this is a deploy/app problem ($(date -u +%F\ %H:%M) UTC)" \
            --body "The site is not responding, but AWS infrastructure is healthy:

- EKS cluster: \`${{ steps.infra.outputs.eks }}\`
- RDS: \`${{ steps.infra.outputs.rds }}\`
- Load balancer: \`${{ steps.infra.outputs.alb }}\`
- App probe: ${{ steps.app.outputs.detail }}

**This is NOT a disaster-recovery situation. Do NOT fail over.**
Most likely a bad deploy or a crash-looping pod.

Check: \`kubectl get pods -n vendure-production\`, recent deploy commits,
then roll back with \`kubectl rollout undo\`."

      - name: 🔴 App down AND AWS unreachable — possible regional event
        if: steps.app.outputs.down == 'true' && steps.infra.outputs.verdict == 'REGIONAL'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "🔴 POSSIBLE REGIONAL OUTAGE — DR decision needed ($(date -u +%F\ %H:%M) UTC)" \
            --body "The site is down AND AWS ap-south-1 is not answering normally:

- EKS cluster: \`${{ steps.infra.outputs.eks }}\`
- RDS: \`${{ steps.infra.outputs.rds }}\`
- Load balancer: \`${{ steps.infra.outputs.alb }}\`
- App probe: ${{ steps.app.outputs.detail }}

**This may be a regional event. A HUMAN must decide whether to fail over.**

1. Check https://health.aws.amazon.com/health/status
2. If AWS confirms a multi-hour ap-south-1 impact -> open docs/dr/RUNBOOK.md step 0
3. Failover is IRREVERSIBLE. Do not start it on a 10-minute blip."
