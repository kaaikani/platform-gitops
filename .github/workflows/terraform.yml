name: Terraform

# Run on PRs (plan only) and on merges to main (plan + apply).
# Only when something under terraform/ actually changes.
on:
  pull_request:
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yml"
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yml"

# OIDC needs id-token: write. pull-requests: write lets us comment the plan.
permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  AWS_REGION: ap-south-1
  TF_ROLE_ARN: arn:aws:iam::149536454380:role/github-actions-terraform
  # Cloudflare provider (dr_cloudflare.tf) reads this automatically.
  # Token scope: DNS:Edit + Zone:Read on the 5 zones, expires 2027-08-03.
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

# All terraform commands run inside the terraform/ subdirectory.
defaults:
  run:
    working-directory: terraform

jobs:
  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Exchange the GitHub OIDC token for short-lived AWS credentials.
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.TF_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        run: terraform validate

      # Saved-plan flow: the apply executes EXACTLY the plan produced seconds
      # earlier in this same job -- terraform refuses a stale plan if anything
      # changed in between. Closes the review-one-plan/apply-another gap
      # within the run (cross-run PR-plan artifacts need environments; later).
      - name: Terraform Plan
        run: terraform plan -no-color -input=false -out=tfplan

      # Apply ONLY on a real push to main (i.e. after a PR is merged).
      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: terraform apply -input=false tfplan
