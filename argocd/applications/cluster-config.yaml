# =============================================================================
# ArgoCD Application - Cluster Config
# =============================================================================
# Manages cluster-scoped resources (PriorityClasses, ClusterRoles, etc.)
# MUST sync before monitoring-stack so PriorityClass exists when referenced.
#
# Sync wave: -1 (runs before all other apps in app-of-apps)
# =============================================================================

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cluster-config
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app: cluster-config
    component: cluster-wide
  annotations:
    argocd.argoproj.io/sync-wave: "-1"   # Deploy before monitoring-stack and vendure apps
spec:
  project: default

  source:
    repoURL: https://github.com/kaaikani/platform-gitops.git
    targetRevision: master
    path: cluster-config

  destination:
    server: https://kubernetes.default.svc
    namespace: default   # Cluster-scoped resources ignore namespace

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - PrunePropagationPolicy=foreground
    retry:
      limit: 3
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 1m
