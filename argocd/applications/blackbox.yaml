# =============================================================================
# ArgoCD Application - Prometheus Blackbox Exporter
# =============================================================================
# Probes HTTP/HTTPS endpoints and SSL certificates for uptime monitoring.
# Feeds EndpointDown, EndpointSlow, SSLCertExpiringSoon alerts.
# =============================================================================

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: blackbox-exporter
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app: monitoring
    component: blackbox
spec:
  project: default

  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: prometheus-blackbox-exporter
      targetRevision: 8.17.0
      helm:
        releaseName: blackbox
        valueFiles:
          - $values/environments/production/blackbox-values.yaml
    - repoURL: https://github.com/kaaikani/platform-gitops.git
      targetRevision: master
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
