# =============================================================================
# ArgoCD Application - Monitoring Stack (kube-prometheus-stack)
# =============================================================================
# Manages the Prometheus/Grafana monitoring stack
# Uses multi-source: Helm chart from prometheus-community + values from Git
# Requires ArgoCD 2.6+
# =============================================================================

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring-stack
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app: monitoring
    component: prometheus-stack
spec:
  project: default

  # Multi-source: Helm chart from external repo + values from Git
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 55.0.0
      helm:
        releaseName: prometheus-stack
        valueFiles:
          - $values/environments/production/monitoring-values.yaml
    - repoURL: https://github.com/kaaikani/platform-gitops.git
      targetRevision: master
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m

  ignoreDifferences:
    - group: ""
      kind: Secret
      name: prometheus-stack-grafana
      jsonPointers:
        - /data
    - group: apps
      kind: Deployment
      name: prometheus-stack-grafana
      jsonPointers:
        - /spec/template/spec/containers/0/env
        - /spec/template/metadata/annotations
