# =============================================================================
# ArgoCD Application - South Mithai Production
# =============================================================================
# Manages the South Mithai Remix Storefront production deployment using Helm
# Reuses the same storefront Helm chart with southmithai-specific values
# =============================================================================

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: southmithai-production
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    environment: production
    app: southmithai
  annotations:
    argocd-image-updater.argoproj.io/image-list: app=149536454380.dkr.ecr.ap-south-1.amazonaws.com/southmithai
    argocd-image-updater.argoproj.io/app.update-strategy: semver
    argocd-image-updater.argoproj.io/app.helm.image-tag: app.image.tag
    argocd-image-updater.argoproj.io/app.allow-tags: regexp:^v[0-9]+\.[0-9]+\.[0-9]+$
    argocd-image-updater.argoproj.io/write-back-method: git:secret:argocd/argocd-image-updater-secret
    argocd-image-updater.argoproj.io/git-branch: master
spec:
  project: default

  source:
    repoURL: https://github.com/kaaikani/platform-gitops.git
    targetRevision: master
    path: storefront
    helm:
      valueFiles:
        - values.yaml
        - values-production.yaml
        - ../environments/production/southmithai-values.yaml
      releaseName: southmithai-production

  destination:
    server: https://kubernetes.default.svc
    namespace: southmithai-production

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m

  ignoreDifferences:
    - group: ""
      kind: Secret
      jsonPointers:
        - /data
    - group: argoproj.io
      kind: Rollout
      jsonPointers:
        - /spec/replicas
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
