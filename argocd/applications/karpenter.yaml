# =============================================================================
# ArgoCD Application - Karpenter Configuration
# =============================================================================
# Manages Karpenter NodePools and EC2NodeClass resources
# These are Kubernetes CRDs, not Helm charts
# Uses Kustomize source so ArgoCD processes kustomization.yaml correctly
# =============================================================================

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: karpenter-config
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app: karpenter
    component: infrastructure
spec:
  project: default

  source:
    repoURL: https://github.com/kaaikani/platform-gitops.git
    targetRevision: master
    path: karpenter

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=false
      - PrunePropagationPolicy=foreground
      - PruneLast=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
