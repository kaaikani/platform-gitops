# =============================================================================
# ArgoCD Application - Vendure Production
# =============================================================================
# Manages the Vendure production deployment using Helm charts
# =============================================================================

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vendure-production
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    environment: production
    app: vendure
  annotations: {}
spec:
  project: default
  
  source:
    repoURL: https://github.com/kaaikani/platform-gitops.git
    targetRevision: main
    path: vendure-stack
    helm:
      valueFiles:
        - values.yaml
        - values-production.yaml
        - ../environments/production/vendure-values.yaml
      releaseName: vendure-production
  
  destination:
    server: https://kubernetes.default.svc
    namespace: vendure-production
  
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  
  ignoreDifferences:
    - group: ""
      kind: Secret
      jsonPointers:
        - /data
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas

