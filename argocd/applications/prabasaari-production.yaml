# =============================================================================
# ArgoCD Application — Prabasaari Production
# =============================================================================
# Manages the Prabasaari Next.js storefront (prabhasaaridesigns.com).
# Image tag is bumped by the prabas-aari client repo's GitHub Actions
# workflow on every push to main (CI commits the new tag directly to this
# repo's main branch). Same pattern as southmithai / vendure-client.
# =============================================================================

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prabasaari-production
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    environment: production
    app: prabasaari
  # Image Updater intentionally NOT enabled — the client repo's workflow
  # does the values bump itself.
spec:
  project: default

  source:
    repoURL: https://github.com/kaaikani/platform-gitops.git
    targetRevision: main
    path: prabasaari
    helm:
      valueFiles:
        - values.yaml
        - ../environments/production/prabasaari-values.yaml
      releaseName: prabasaari-production

  destination:
    server: https://kubernetes.default.svc
    namespace: prabasaari-production

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m

  ignoreDifferences:
    - group: ""
      kind: Secret
      jsonPointers:
        - /data
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
