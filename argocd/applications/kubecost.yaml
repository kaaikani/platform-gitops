# =============================================================================
# ArgoCD Application - Kubecost (cost-analyzer)
# =============================================================================
# Manages Kubecost for cluster cost monitoring and optimization
# Uses multi-source: Helm chart from kubecost repo + values from Git
# Requires ArgoCD 2.6+
# =============================================================================

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kubecost
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app: kubecost
    component: cost-analyzer
spec:
  project: default

  # Multi-source: Helm chart from external repo + values from Git
  sources:
    - repoURL: https://kubecost.github.io/cost-analyzer/
      chart: cost-analyzer
      targetRevision: 2.6.1
      helm:
        releaseName: kubecost
        valueFiles:
          - $values/environments/production/kubecost-values.yaml
    - repoURL: https://github.com/kaaikani/platform-gitops.git
      targetRevision: master
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: kubecost

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
