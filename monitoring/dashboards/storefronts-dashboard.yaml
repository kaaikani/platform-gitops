apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-storefronts
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: "Kaaikani Production"
data:
  storefronts.json: |
    {
      "title": "Storefronts — southmithai / swadkerala / storefront",
      "uid": "storefronts-v1",
      "schemaVersion": 38,
      "version": 1,
      "refresh": "30s",
      "time": { "from": "now-3h", "to": "now" },
      "timezone": "browser",
      "tags": ["storefront", "southmithai", "swadkerala", "production"],
      "templating": {
        "list": [
          {
            "name": "datasource",
            "type": "datasource",
            "query": "prometheus",
            "label": "Datasource"
          },
          {
            "name": "namespace",
            "type": "custom",
            "label": "Site",
            "query": "southmithai-production,swadkerala-production,storefront-production",
            "current": { "text": "southmithai-production", "value": "southmithai-production" },
            "options": [
              { "text": "southmithai-production", "value": "southmithai-production" },
              { "text": "swadkerala-production",  "value": "swadkerala-production"  },
              { "text": "storefront-production",  "value": "storefront-production"  }
            ],
            "includeAll": false,
            "multi": false
          }
        ]
      },
      "panels": [

        { "id": 1, "type": "stat", "title": "Running Pods",
          "gridPos": { "x": 0, "y": 0, "w": 4, "h": 4 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": { "defaults": { "color": { "mode": "thresholds" }, "thresholds": { "steps": [{ "color": "red", "value": 0 }, { "color": "yellow", "value": 1 }, { "color": "green", "value": 2 }] } } },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "background" },
          "targets": [{ "expr": "count(kube_pod_status_phase{namespace=\"$namespace\", phase=\"Running\"})", "legendFormat": "Running" }]
        },

        { "id": 2, "type": "stat", "title": "HPA Replicas",
          "gridPos": { "x": 4, "y": 0, "w": 4, "h": 4 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": { "defaults": { "color": { "mode": "thresholds" }, "thresholds": { "steps": [{ "color": "green", "value": 0 }, { "color": "yellow", "value": 3 }, { "color": "red", "value": 4 }] } } },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "background" },
          "targets": [
            { "expr": "kube_horizontalpodautoscaler_status_current_replicas{namespace=\"$namespace\"}", "legendFormat": "Current" },
            { "expr": "kube_horizontalpodautoscaler_spec_max_replicas{namespace=\"$namespace\"}", "legendFormat": "Max" }
          ]
        },

        { "id": 3, "type": "stat", "title": "Total CPU Usage",
          "gridPos": { "x": 8, "y": 0, "w": 4, "h": 4 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": { "defaults": { "unit": "short", "color": { "mode": "thresholds" }, "thresholds": { "steps": [{ "color": "green", "value": 0 }, { "color": "yellow", "value": 0.3 }, { "color": "red", "value": 0.8 }] } } },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "background" },
          "targets": [{ "expr": "sum(rate(container_cpu_usage_seconds_total{namespace=\"$namespace\", container!=\"POD\", container!=\"\"}[5m]))", "legendFormat": "CPU Cores" }]
        },

        { "id": 4, "type": "stat", "title": "Total Memory Usage",
          "gridPos": { "x": 12, "y": 0, "w": 4, "h": 4 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": { "defaults": { "unit": "bytes", "color": { "mode": "thresholds" }, "thresholds": { "steps": [{ "color": "green", "value": 0 }, { "color": "yellow", "value": 268435456 }, { "color": "red", "value": 536870912 }] } } },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "background" },
          "targets": [{ "expr": "sum(container_memory_working_set_bytes{namespace=\"$namespace\", container!=\"POD\", container!=\"\"})", "legendFormat": "Memory" }]
        },

        { "id": 5, "type": "stat", "title": "Pod Restarts (24h)",
          "gridPos": { "x": 16, "y": 0, "w": 4, "h": 4 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": { "defaults": { "color": { "mode": "thresholds" }, "thresholds": { "steps": [{ "color": "green", "value": 0 }, { "color": "yellow", "value": 3 }, { "color": "red", "value": 10 }] } } },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "background" },
          "targets": [{ "expr": "sum(increase(kube_pod_container_status_restarts_total{namespace=\"$namespace\"}[24h]))", "legendFormat": "Restarts" }]
        },

        { "id": 6, "type": "stat", "title": "Network In (last 5m avg)",
          "gridPos": { "x": 20, "y": 0, "w": 4, "h": 4 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": { "defaults": { "unit": "Bps", "color": { "mode": "thresholds" }, "thresholds": { "steps": [{ "color": "blue", "value": 0 }] } } },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "background" },
          "targets": [{ "expr": "sum(rate(container_network_receive_bytes_total{namespace=\"$namespace\"}[5m]))", "legendFormat": "Bytes/s In" }]
        },

        { "id": 10, "type": "row", "title": "CPU", "gridPos": { "x": 0, "y": 4, "w": 24, "h": 1 }, "collapsed": false },

        { "id": 11, "type": "timeseries", "title": "CPU Usage per Pod",
          "gridPos": { "x": 0, "y": 5, "w": 12, "h": 8 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": { "defaults": { "unit": "short", "custom": { "lineWidth": 2 } } },
          "options": { "tooltip": { "mode": "multi" }, "legend": { "displayMode": "table", "placement": "bottom", "calcs": ["mean", "max", "lastNotNull"] } },
          "targets": [{ "expr": "sum by (pod) (rate(container_cpu_usage_seconds_total{namespace=\"$namespace\", container!=\"POD\", container!=\"\"}[5m]))", "legendFormat": "{{pod}}" }]
        },

        { "id": 12, "type": "timeseries", "title": "CPU % of Request",
          "gridPos": { "x": 12, "y": 5, "w": 12, "h": 8 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": { "defaults": { "unit": "percent", "custom": { "lineWidth": 2 }, "thresholds": { "steps": [{ "color": "green", "value": 0 }, { "color": "yellow", "value": 60 }, { "color": "red", "value": 90 }] } } },
          "options": { "tooltip": { "mode": "multi" }, "legend": { "displayMode": "table", "placement": "bottom", "calcs": ["mean", "max"] } },
          "targets": [{ "expr": "sum by (pod) (rate(container_cpu_usage_seconds_total{namespace=\"$namespace\", container!=\"POD\", container!=\"\"}[5m])) / sum by (pod) (kube_pod_container_resource_requests{namespace=\"$namespace\", resource=\"cpu\", container!=\"POD\", container!=\"\"}) * 100", "legendFormat": "{{pod}}" }]
        },

        { "id": 20, "type": "row", "title": "Memory", "gridPos": { "x": 0, "y": 13, "w": 24, "h": 1 }, "collapsed": false },

        { "id": 21, "type": "timeseries", "title": "Memory Usage per Pod",
          "gridPos": { "x": 0, "y": 14, "w": 12, "h": 8 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": { "defaults": { "unit": "bytes", "custom": { "lineWidth": 2 } } },
          "options": { "tooltip": { "mode": "multi" }, "legend": { "displayMode": "table", "placement": "bottom", "calcs": ["mean", "max", "lastNotNull"] } },
          "targets": [{ "expr": "sum by (pod) (container_memory_working_set_bytes{namespace=\"$namespace\", container!=\"POD\", container!=\"\"})", "legendFormat": "{{pod}}" }]
        },

        { "id": 22, "type": "timeseries", "title": "Memory % of Limit",
          "gridPos": { "x": 12, "y": 14, "w": 12, "h": 8 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": { "defaults": { "unit": "percent", "min": 0, "max": 100, "custom": { "lineWidth": 2 }, "thresholds": { "steps": [{ "color": "green", "value": 0 }, { "color": "yellow", "value": 70 }, { "color": "red", "value": 90 }] } } },
          "options": { "tooltip": { "mode": "multi" }, "legend": { "displayMode": "table", "placement": "bottom", "calcs": ["mean", "max"] } },
          "targets": [{ "expr": "sum by (pod) (container_memory_working_set_bytes{namespace=\"$namespace\", container!=\"POD\", container!=\"\"}) / sum by (pod) (kube_pod_container_resource_limits{namespace=\"$namespace\", resource=\"memory\", container!=\"POD\", container!=\"\"}) * 100", "legendFormat": "{{pod}}" }]
        },

        { "id": 30, "type": "row", "title": "Network Traffic", "gridPos": { "x": 0, "y": 22, "w": 24, "h": 1 }, "collapsed": false },

        { "id": 31, "type": "timeseries", "title": "Network Received per Pod (Inbound Traffic)",
          "gridPos": { "x": 0, "y": 23, "w": 12, "h": 8 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": { "defaults": { "unit": "Bps", "custom": { "lineWidth": 2 } } },
          "options": { "tooltip": { "mode": "multi" }, "legend": { "displayMode": "table", "placement": "bottom", "calcs": ["mean", "max", "lastNotNull"] } },
          "targets": [{ "expr": "sum by (pod) (rate(container_network_receive_bytes_total{namespace=\"$namespace\"}[5m]))", "legendFormat": "{{pod}}" }]
        },

        { "id": 32, "type": "timeseries", "title": "Network Transmitted per Pod (Outbound)",
          "gridPos": { "x": 12, "y": 23, "w": 12, "h": 8 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": { "defaults": { "unit": "Bps", "custom": { "lineWidth": 2 } } },
          "options": { "tooltip": { "mode": "multi" }, "legend": { "displayMode": "table", "placement": "bottom", "calcs": ["mean", "max", "lastNotNull"] } },
          "targets": [{ "expr": "sum by (pod) (rate(container_network_transmit_bytes_total{namespace=\"$namespace\"}[5m]))", "legendFormat": "{{pod}}" }]
        },

        { "id": 40, "type": "row", "title": "Autoscaling (HPA)", "gridPos": { "x": 0, "y": 31, "w": 24, "h": 1 }, "collapsed": false },

        { "id": 41, "type": "timeseries", "title": "HPA Replicas over Time",
          "gridPos": { "x": 0, "y": 32, "w": 12, "h": 7 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": { "defaults": { "unit": "short", "decimals": 0, "custom": { "lineWidth": 2, "fillOpacity": 10 } } },
          "options": { "legend": { "displayMode": "list", "placement": "bottom" } },
          "targets": [
            { "expr": "kube_horizontalpodautoscaler_status_current_replicas{namespace=\"$namespace\"}", "legendFormat": "Current" },
            { "expr": "kube_horizontalpodautoscaler_status_desired_replicas{namespace=\"$namespace\"}", "legendFormat": "Desired" },
            { "expr": "kube_horizontalpodautoscaler_spec_max_replicas{namespace=\"$namespace\"}", "legendFormat": "Max" }
          ]
        },

        { "id": 42, "type": "timeseries", "title": "Pod Restarts History",
          "gridPos": { "x": 12, "y": 32, "w": 12, "h": 7 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": { "defaults": { "unit": "short", "custom": { "lineWidth": 2 }, "thresholds": { "steps": [{ "color": "green", "value": 0 }, { "color": "red", "value": 1 }] } } },
          "options": { "legend": { "displayMode": "table", "placement": "bottom", "calcs": ["lastNotNull"] } },
          "targets": [{ "expr": "increase(kube_pod_container_status_restarts_total{namespace=\"$namespace\"}[1h])", "legendFormat": "{{pod}}" }]
        }

      ]
    }
