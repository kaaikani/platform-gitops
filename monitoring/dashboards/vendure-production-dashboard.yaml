apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-vendure-production
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: "Kaaikani Production"
data:
  vendure-production.json: |
    {
      "title": "Vendure Production",
      "uid": "vendure-prod-v1",
      "schemaVersion": 38,
      "version": 1,
      "refresh": "30s",
      "time": { "from": "now-3h", "to": "now" },
      "timezone": "browser",
      "tags": ["vendure", "production", "kaaikani"],
      "templating": {
        "list": [
          {
            "name": "datasource",
            "type": "datasource",
            "query": "prometheus",
            "label": "Datasource",
            "current": {}
          }
        ]
      },
      "panels": [

        { "id": 1, "type": "stat", "title": "Running Pods",
          "gridPos": { "x": 0, "y": 0, "w": 4, "h": 4 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": { "defaults": { "color": { "mode": "thresholds" }, "thresholds": { "steps": [{ "color": "red", "value": 0 }, { "color": "yellow", "value": 1 }, { "color": "green", "value": 2 }] } } },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "orientation": "auto", "textMode": "auto", "colorMode": "background" },
          "targets": [{ "expr": "count(kube_pod_status_phase{namespace=\"vendure-production\", phase=\"Running\"})", "legendFormat": "Pods" }]
        },

        { "id": 2, "type": "stat", "title": "HPA Replicas (current / max)",
          "gridPos": { "x": 4, "y": 0, "w": 4, "h": 4 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": { "defaults": { "color": { "mode": "thresholds" }, "thresholds": { "steps": [{ "color": "green", "value": 0 }, { "color": "yellow", "value": 4 }, { "color": "red", "value": 6 }] } } },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "background" },
          "targets": [
            { "expr": "kube_horizontalpodautoscaler_status_current_replicas{namespace=\"vendure-production\"}", "legendFormat": "Current" },
            { "expr": "kube_horizontalpodautoscaler_spec_max_replicas{namespace=\"vendure-production\"}", "legendFormat": "Max" }
          ]
        },

        { "id": 3, "type": "stat", "title": "Total CPU Usage",
          "gridPos": { "x": 8, "y": 0, "w": 4, "h": 4 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": { "defaults": { "unit": "percentunit", "color": { "mode": "thresholds" }, "thresholds": { "steps": [{ "color": "green", "value": 0 }, { "color": "yellow", "value": 0.7 }, { "color": "red", "value": 1.5 }] } } },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "background" },
          "targets": [{ "expr": "sum(rate(container_cpu_usage_seconds_total{namespace=\"vendure-production\", container=\"vendure\"}[5m]))", "legendFormat": "Total CPU" }]
        },

        { "id": 4, "type": "stat", "title": "Total Memory Usage",
          "gridPos": { "x": 12, "y": 0, "w": 4, "h": 4 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": { "defaults": { "unit": "bytes", "color": { "mode": "thresholds" }, "thresholds": { "steps": [{ "color": "green", "value": 0 }, { "color": "yellow", "value": 536870912 }, { "color": "red", "value": 1073741824 }] } } },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "background" },
          "targets": [{ "expr": "sum(container_memory_working_set_bytes{namespace=\"vendure-production\", container=\"vendure\"})", "legendFormat": "Memory" }]
        },

        { "id": 5, "type": "stat", "title": "Pod Restarts (24h)",
          "gridPos": { "x": 16, "y": 0, "w": 4, "h": 4 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": { "defaults": { "color": { "mode": "thresholds" }, "thresholds": { "steps": [{ "color": "green", "value": 0 }, { "color": "yellow", "value": 1 }, { "color": "red", "value": 5 }] } } },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "background" },
          "targets": [{ "expr": "sum(increase(kube_pod_container_status_restarts_total{namespace=\"vendure-production\", container=\"vendure\"}[24h]))", "legendFormat": "Restarts" }]
        },

        { "id": 6, "type": "stat", "title": "CPU Throttle % (avg)",
          "gridPos": { "x": 20, "y": 0, "w": 4, "h": 4 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": { "defaults": { "unit": "percent", "color": { "mode": "thresholds" }, "thresholds": { "steps": [{ "color": "green", "value": 0 }, { "color": "yellow", "value": 10 }, { "color": "red", "value": 25 }] } } },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "background" },
          "targets": [{ "expr": "avg(rate(container_cpu_cfs_throttled_periods_total{namespace=\"vendure-production\", container=\"vendure\"}[5m]) / rate(container_cpu_cfs_periods_total{namespace=\"vendure-production\", container=\"vendure\"}[5m]) * 100)", "legendFormat": "Throttle %" }]
        },

        { "id": 10, "type": "row", "title": "CPU", "gridPos": { "x": 0, "y": 4, "w": 24, "h": 1 }, "collapsed": false },

        { "id": 11, "type": "timeseries", "title": "CPU Usage per Pod (cores)",
          "gridPos": { "x": 0, "y": 5, "w": 12, "h": 8 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": { "defaults": { "unit": "short", "custom": { "lineWidth": 2 } } },
          "options": { "tooltip": { "mode": "multi" }, "legend": { "displayMode": "table", "placement": "bottom", "calcs": ["mean", "max", "lastNotNull"] } },
          "targets": [{ "expr": "sum by (pod) (rate(container_cpu_usage_seconds_total{namespace=\"vendure-production\", container=\"vendure\"}[5m]))", "legendFormat": "{{pod}}" }]
        },

        { "id": 12, "type": "timeseries", "title": "CPU Throttle % per Pod  (0% = healthy, was 1190 events before fix)",
          "gridPos": { "x": 12, "y": 5, "w": 12, "h": 8 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": { "defaults": { "unit": "percent", "min": 0, "max": 100, "custom": { "lineWidth": 2 }, "thresholds": { "steps": [{ "color": "green", "value": 0 }, { "color": "red", "value": 10 }] } } },
          "options": { "tooltip": { "mode": "multi" }, "legend": { "displayMode": "table", "placement": "bottom", "calcs": ["mean", "max"] } },
          "targets": [{ "expr": "sum by (pod) (rate(container_cpu_cfs_throttled_periods_total{namespace=\"vendure-production\", container=\"vendure\"}[5m])) / sum by (pod) (rate(container_cpu_cfs_periods_total{namespace=\"vendure-production\", container=\"vendure\"}[5m])) * 100", "legendFormat": "{{pod}}" }]
        },

        { "id": 20, "type": "row", "title": "Memory", "gridPos": { "x": 0, "y": 13, "w": 24, "h": 1 }, "collapsed": false },

        { "id": 21, "type": "timeseries", "title": "Memory Usage per Pod",
          "gridPos": { "x": 0, "y": 14, "w": 12, "h": 8 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": { "defaults": { "unit": "bytes", "custom": { "lineWidth": 2 } } },
          "options": { "tooltip": { "mode": "multi" }, "legend": { "displayMode": "table", "placement": "bottom", "calcs": ["mean", "max", "lastNotNull"] } },
          "targets": [{ "expr": "sum by (pod) (container_memory_working_set_bytes{namespace=\"vendure-production\", container=\"vendure\"})", "legendFormat": "{{pod}}" }]
        },

        { "id": 22, "type": "timeseries", "title": "Memory % of Limit (limit = 1Gi)",
          "gridPos": { "x": 12, "y": 14, "w": 12, "h": 8 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": { "defaults": { "unit": "percent", "min": 0, "max": 100, "custom": { "lineWidth": 2 }, "thresholds": { "steps": [{ "color": "green", "value": 0 }, { "color": "yellow", "value": 70 }, { "color": "red", "value": 90 }] } } },
          "options": { "tooltip": { "mode": "multi" }, "legend": { "displayMode": "table", "placement": "bottom", "calcs": ["mean", "max"] } },
          "targets": [{ "expr": "sum by (pod) (container_memory_working_set_bytes{namespace=\"vendure-production\", container=\"vendure\"}) / sum by (pod) (kube_pod_container_resource_limits{namespace=\"vendure-production\", container=\"vendure\", resource=\"memory\"}) * 100", "legendFormat": "{{pod}}" }]
        },

        { "id": 30, "type": "row", "title": "Network Traffic (Inbound = customer requests)", "gridPos": { "x": 0, "y": 22, "w": 24, "h": 1 }, "collapsed": false },

        { "id": 31, "type": "timeseries", "title": "Network Received (Inbound Requests Traffic)",
          "gridPos": { "x": 0, "y": 23, "w": 12, "h": 8 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": { "defaults": { "unit": "Bps", "custom": { "lineWidth": 2 } } },
          "options": { "tooltip": { "mode": "multi" }, "legend": { "displayMode": "table", "placement": "bottom", "calcs": ["mean", "max", "lastNotNull"] } },
          "targets": [
            { "expr": "sum by (pod) (rate(container_network_receive_bytes_total{namespace=\"vendure-production\", pod=~\"vendure-production-vendure-stack-vendure.*\"}[5m]))", "legendFormat": "{{pod}} - in" }
          ]
        },

        { "id": 32, "type": "timeseries", "title": "Network Transmitted (Outbound Responses)",
          "gridPos": { "x": 12, "y": 23, "w": 12, "h": 8 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": { "defaults": { "unit": "Bps", "custom": { "lineWidth": 2 } } },
          "options": { "tooltip": { "mode": "multi" }, "legend": { "displayMode": "table", "placement": "bottom", "calcs": ["mean", "max", "lastNotNull"] } },
          "targets": [
            { "expr": "sum by (pod) (rate(container_network_transmit_bytes_total{namespace=\"vendure-production\", pod=~\"vendure-production-vendure-stack-vendure.*\"}[5m]))", "legendFormat": "{{pod}} - out" }
          ]
        },

        { "id": 40, "type": "row", "title": "Autoscaling (HPA)", "gridPos": { "x": 0, "y": 31, "w": 24, "h": 1 }, "collapsed": false },

        { "id": 41, "type": "timeseries", "title": "HPA Replicas over Time",
          "gridPos": { "x": 0, "y": 32, "w": 12, "h": 8 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": { "defaults": { "unit": "short", "decimals": 0, "custom": { "lineWidth": 2, "fillOpacity": 10 } } },
          "options": { "tooltip": { "mode": "multi" }, "legend": { "displayMode": "list", "placement": "bottom" } },
          "targets": [
            { "expr": "kube_horizontalpodautoscaler_status_current_replicas{namespace=\"vendure-production\"}", "legendFormat": "Current Replicas" },
            { "expr": "kube_horizontalpodautoscaler_status_desired_replicas{namespace=\"vendure-production\"}", "legendFormat": "Desired Replicas" },
            { "expr": "kube_horizontalpodautoscaler_spec_max_replicas{namespace=\"vendure-production\"}", "legendFormat": "Max Replicas" },
            { "expr": "kube_horizontalpodautoscaler_spec_min_replicas{namespace=\"vendure-production\"}", "legendFormat": "Min Replicas" }
          ]
        },

        { "id": 42, "type": "timeseries", "title": "HPA CPU Utilization vs Target (150% = scale trigger)",
          "gridPos": { "x": 12, "y": 32, "w": 12, "h": 8 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": { "defaults": { "unit": "percent", "custom": { "lineWidth": 2 } } },
          "options": { "tooltip": { "mode": "multi" }, "legend": { "displayMode": "list", "placement": "bottom" } },
          "targets": [
            { "expr": "avg(sum by (pod) (rate(container_cpu_usage_seconds_total{namespace=\"vendure-production\", container=\"vendure\"}[5m])) / 0.8 * 100)", "legendFormat": "CPU Utilization % of Request" },
            { "expr": "150", "legendFormat": "Scale Trigger (150%)" }
          ]
        },

        { "id": 50, "type": "row", "title": "Worker Pod", "gridPos": { "x": 0, "y": 40, "w": 24, "h": 1 }, "collapsed": false },

        { "id": 51, "type": "timeseries", "title": "Worker CPU Usage",
          "gridPos": { "x": 0, "y": 41, "w": 12, "h": 7 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": { "defaults": { "unit": "short", "custom": { "lineWidth": 2 } } },
          "options": { "legend": { "displayMode": "list", "placement": "bottom" } },
          "targets": [{ "expr": "sum(rate(container_cpu_usage_seconds_total{namespace=\"vendure-production\", container!=\"POD\", pod=~\"vendure-production-vendure-stack-worker.*\"}[5m]))", "legendFormat": "Worker CPU" }]
        },

        { "id": 52, "type": "timeseries", "title": "Worker Memory Usage",
          "gridPos": { "x": 12, "y": 41, "w": 12, "h": 7 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": { "defaults": { "unit": "bytes", "custom": { "lineWidth": 2 } } },
          "options": { "legend": { "displayMode": "list", "placement": "bottom" } },
          "targets": [{ "expr": "sum(container_memory_working_set_bytes{namespace=\"vendure-production\", pod=~\"vendure-production-vendure-stack-worker.*\", container!=\"POD\"})", "legendFormat": "Worker Memory" }]
        },

        { "id": 60, "type": "row", "title": "Pod Health & Restarts", "gridPos": { "x": 0, "y": 48, "w": 24, "h": 1 }, "collapsed": false },

        { "id": 61, "type": "timeseries", "title": "Pod Restarts over Time",
          "gridPos": { "x": 0, "y": 49, "w": 12, "h": 7 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": { "defaults": { "unit": "short", "custom": { "lineWidth": 2 }, "thresholds": { "steps": [{ "color": "green", "value": 0 }, { "color": "red", "value": 1 }] } } },
          "options": { "legend": { "displayMode": "table", "placement": "bottom", "calcs": ["lastNotNull"] } },
          "targets": [{ "expr": "increase(kube_pod_container_status_restarts_total{namespace=\"vendure-production\", container=\"vendure\"}[1h])", "legendFormat": "{{pod}}" }]
        },

        { "id": 62, "type": "table", "title": "Pod Status",
          "gridPos": { "x": 12, "y": 49, "w": 12, "h": 7 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "options": { "sortBy": [{ "displayName": "Pod" }] },
          "targets": [
            { "expr": "kube_pod_status_phase{namespace=\"vendure-production\"} == 1", "legendFormat": "{{pod}} — {{phase}}", "instant": true, "format": "table" }
          ],
          "transformations": [{ "id": "organize", "options": { "excludeByName": { "Time": true, "Value": true, "__name__": true, "job": true, "instance": true, "service": true } } }]
        }

      ]
    }
