{{- if .Values.networkPolicies.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "prabasaari.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "prabasaari.labels" . | nindent 4 }}
    app.kubernetes.io/component: network-policy
spec:
  podSelector:
    matchLabels:
      {{- include "prabasaari.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: prabasaari
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: {{ .Values.app.service.targetPort }}
    - from:
        - namespaceSelector:
            matchLabels:
              name: kube-system
      ports:
        - protocol: TCP
          port: {{ .Values.app.service.targetPort }}
  egress:
    # DNS
    - to:
        - namespaceSelector:
            matchLabels:
              name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - namespaceSelector:
            matchLabels:
              name: kube-system
          podSelector:
            matchLabels:
              eks.amazonaws.com/component: coredns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # HTTPS (Vendure shop-api, Google OAuth, external services)
    - to: []
      ports:
        - protocol: TCP
          port: 443
    # HTTP
    - to: []
      ports:
        - protocol: TCP
          port: 80
{{- end }}
