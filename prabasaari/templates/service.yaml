{{- if .Values.app.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "prabasaari.fullname" . }}
  labels:
    {{- include "prabasaari.labels" . | nindent 4 }}
    app.kubernetes.io/component: prabasaari
spec:
  type: {{ .Values.app.service.type }}
  ports:
    - name: http
      port: {{ .Values.app.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "prabasaari.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: prabasaari
{{- end }}
