{{- if and .Values.app.enabled .Values.app.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "prabasaari.fullname" . }}
  labels:
    {{- include "prabasaari.labels" . | nindent 4 }}
    app.kubernetes.io/component: prabasaari
spec:
  {{- if .Values.app.podDisruptionBudget.minAvailable }}
  minAvailable: {{ .Values.app.podDisruptionBudget.minAvailable }}
  {{- else }}
  maxUnavailable: {{ .Values.app.podDisruptionBudget.maxUnavailable | default 1 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "prabasaari.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: prabasaari
{{- end }}
