# =============================================================================
# TEMPO - DISTRIBUTED TRACING (LOCAL)
# =============================================================================
# Tempo for local testing (Minikube/Docker Desktop/Kind)
# Uses filesystem storage (no S3 needed for local)
#
# Usage:
#   helm repo add grafana https://grafana.github.io/helm-charts
#   helm repo update
#   helm install tempo grafana/tempo-distributed \
#     -n monitoring \
#     -f helm/environments/local/tempo-values.yaml
# =============================================================================

tempo:
  # Single replica for local
  replicas: 1

  # Use filesystem storage for local (simpler than S3)
  storage:
    type: filesystem
    filesystem:
      directory: /var/tempo/traces

  # Shorter retention for local (3 days)
  retention:
    period: 72h  # 3 days
    deleteRequest:
      enabled: true
      period: 12h

  # Minimal resources for local
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  # No node selectors for local
  nodeSelector: {}
  tolerations: []

  # Tempo configuration
  config:
    server:
      http_listen_port: 3200
      grpc_listen_port: 9095

    distributor:
      receivers:
        otlp:
          protocols:
            grpc:
              endpoint: 0.0.0.0:4317
            http:
              endpoint: 0.0.0.0:4318
        jaeger:
          protocols:
            thrift_http:
              endpoint: 0.0.0.0:14268
            grpc:
              endpoint: 0.0.0.0:14250
        zipkin:
          endpoint: 0.0.0.0:9411

    ingester:
      max_block_duration: 5m
      max_block_bytes: 1073741824  # 1GB

    compactor:
      compaction:
        block_retention: 72h  # 3 days
        compacted_block_retention: 72h

    storage:
      trace:
        backend: filesystem
        filesystem:
          path: /var/tempo/traces

    overrides:
      defaults:
        ingestion_rate_limit_bytes: 5000000  # 5MB/s (lower for local)
        ingestion_burst_size_bytes: 10000000  # 10MB burst

# Service configuration
service:
  type: ClusterIP
  ports:
    - name: http
      port: 3200
      targetPort: 3200
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
    - name: otlp-http
      port: 4318
      targetPort: 4318

# Persistence for local (optional - can use emptyDir for testing)
persistence:
  enabled: true
  size: 5Gi
  storageClassName: standard  # Minikube default

# =============================================================================
# LOCAL TESTING NOTES
# =============================================================================
#
# 1. Deploy Tempo:
#    helm install tempo grafana/tempo-distributed \
#      -n monitoring \
#      -f helm/environments/local/tempo-values.yaml
#
# 2. Verify Tempo is running:
#    kubectl get pods -n monitoring -l app.kubernetes.io/name=tempo
#
# 3. Add Tempo datasource in Grafana:
#    - URL: http://tempo:3200
#    - Enable trace-to-logs: http://loki:3100
#    - Enable trace-to-metrics: http://prometheus-stack-kube-prom-prometheus:9090
#
# 4. Test tracing:
#    - Make requests to Vendure API
#    - Check Grafana Explore → Tempo
#    - Search: service.name=vendure
#
# =============================================================================

