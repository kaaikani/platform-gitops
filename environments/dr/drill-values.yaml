# DR DRILL overlay — layered ON TOP of environments/production/vendure-values.yaml:
#   helm install vendure ./vendure-stack \
#     -f environments/production/vendure-values.yaml -f environments/dr/drill-values.yaml
#
# Purpose: boot the production stack in the DR cluster with ZERO ability to
# reach customers or production systems. See docs/dr/RUNBOOK.md "DRILL MODE".

global:
  # DR replica registry — same images, replicated by dr_ecr.tf
  imageRegistry: "149536454380.dkr.ecr.ap-south-2.amazonaws.com/"

externalSecrets:
  enabled: true
  aws:
    region: ap-south-2 # replicas + drill secrets live here
  # Drill secrets: DUMMY- external keys (MSG91/Razorpay/SMTP/S3), real internal
  # generated values (COOKIE_SECRET/TOTP_SALT), in-cluster redis, DR db endpoint.
  awsSecrets:
    database: vendure/dr-drill/database
    redis: vendure/dr-drill/redis
    awsS3: vendure/dr-drill/aws-s3
    smtps: vendure/dr-drill/smtps
    integrations: vendure/dr-drill/integrations

serviceAccount:
  create: true
  annotations:
    # DR IRSA role (terraform output irsa_role_arns -> vendure_prod_app)
    eks.amazonaws.com/role-arn: arn:aws:iam::149536454380:role/vendure-dr-vendure-prod-app

# WORKER STAYS OFF until pre-flight isolation checks pass (runbook rule #4:
# the worker is what consumes queues and sends messages). Scale up manually:
#   kubectl scale deploy vendure-worker -n vendure-production --replicas=1
worker:
  replicaCount: 0

# Drill #2: real ALB + HTTPS using the PRE-ISSUED ap-south-2 certs
# (dr_acm.tf, all ISSUED). Same recipe as prod, DR cert ARNs. Cloudflare is
# NOT flipped — we test via the ALB hostname with SNI/Host headers.
ingress:
  enabled: true
  className: alb
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/group.name: vendure-shared
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    # kaaikani + kaaikanistore + *.southmithai (DR-region certs)
    alb.ingress.kubernetes.io/certificate-arn: "arn:aws:acm:ap-south-2:149536454380:certificate/46d8d172-10f0-439b-909d-553d6da023a3,arn:aws:acm:ap-south-2:149536454380:certificate/0908359b-d0bc-4d7a-aa90-13a7a05224fb,arn:aws:acm:ap-south-2:149536454380:certificate/b15f6a3f-3f67-4697-bc9e-d2b1ef75f5cb,arn:aws:acm:ap-south-2:149536454380:certificate/c14a7aa4-b87c-4c2e-ba57-e59cd1553002"
    alb.ingress.kubernetes.io/healthcheck-path: /health
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: "15"
    alb.ingress.kubernetes.io/healthcheck-timeout-seconds: "5"
    alb.ingress.kubernetes.io/healthy-threshold-count: "2"
    alb.ingress.kubernetes.io/unhealthy-threshold-count: "4"
    alb.ingress.kubernetes.io/tags: Environment=dr
  hosts:
    # Browser-verification host: real Cloudflare record, own ACM cert. Lets a
    # human SEE the DR copy at https://dr-test.kaaikani.co.in without touching
    # any customer-facing record. Delete the Cloudflare record after the test.
    - host: dr-test.kaaikani.co.in
      paths:
        - path: /
          pathType: Prefix
          service: vendure
          port: 80
    - host: kaaikani.co.in
      paths:
        - path: /dashboard
          pathType: Prefix
          service: vendure
          port: 80
        - path: /
          pathType: Prefix
          service: vendure
          port: 80
