# =============================================================================
# ArgoCD Applications — GCP ESCAPE CLUSTER ONLY
# =============================================================================
# Turns escape day from six hand-typed helm commands into one `kubectl apply`.
# It also removes a class of mistake that only happens under pressure: a
# forgotten -f, a wrong namespace, a values file typed from memory.
#
# ⚠ PRODUCTION SAFETY — why this cannot leak into production:
# The production app-of-apps (argocd/app-of-apps.yaml) watches ONLY the path
# `argocd/applications`. This file lives under environments/gcp/argocd/, which
# that Application does not read, so production ArgoCD never sees it. Do not
# move this file into argocd/applications/ — it would immediately try to
# deploy GKE-shaped config onto the production EKS cluster.
#
# Apply on the escape cluster ONLY, after bootstrap steps 0-4:
#   kubectl apply -f environments/gcp/argocd/applications.yaml
#
# DRILL MODE: these deploy the ESCAPE configuration — real Redis Cloud
# credentials, real integration keys, real hostnames. For a DRILL, do NOT use
# this file. Use the helm commands in GCP-ESCAPE.md with
# `-f environments/gcp/drill-values.yaml` appended, so the isolation rules
# apply. A drill run through these Applications would share production's job
# queue. See docs/dr/RUNBOOK.md "DRILL MODE".
# =============================================================================
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vendure-production
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/kaaikani/platform-gitops.git
    targetRevision: main
    path: vendure-stack
    helm:
      valueFiles:
        - values.yaml
        - values-production.yaml
        - ../environments/production/vendure-values.yaml
        - ../environments/gcp/vendure-values.yaml
      releaseName: vendure-production
  destination:
    server: https://kubernetes.default.svc
    namespace: vendure-production
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
---
