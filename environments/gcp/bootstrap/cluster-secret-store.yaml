# =============================================================================
# ClusterSecretStore — GCP Secret Manager
# =============================================================================
# The GKE-side counterpart of production's `aws-secrets-manager` store. Every
# GCP overlay names this store, so it must exist BEFORE any app is installed or
# the ExternalSecrets sit Pending and the pods never get their env.
#
# Auth is keyless: the external-secrets KSA impersonates the GSA that
# escape_platform.tf already granted roles/secretmanager.secretAccessor and
# bound with roles/iam.workloadIdentityUser. No service-account key file — the
# project's org policy forbids them, which is the correct policy.
#
#   kubectl apply -f environments/gcp/bootstrap/cluster-secret-store.yaml
# =============================================================================
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: gcp-secrets
spec:
  provider:
    gcpsm:
      projectID: kaaikani-escape
      auth:
        workloadIdentity:
          clusterLocation: asia-south1
          clusterName: kaaikani-escape
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
