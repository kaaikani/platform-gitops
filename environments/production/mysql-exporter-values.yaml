# =============================================================================
# PROMETHEUS MYSQL EXPORTER - PRODUCTION
# =============================================================================
# Exports MySQL/RDS metrics to Prometheus so the "MySQL RDS" Grafana dashboard
# and DBConnectionPoolExhaustion / RDS-health alerts have real data.
#
# Target RDS:  vendure-prod-db.cbq8i48yyklk.ap-south-1.rds.amazonaws.com:3306
# Database:    wow_vendure
# Credentials: exporter-credentials secret in the monitoring namespace
#              (synced from AWS Secrets Manager key vendure/prod/database via
#               monitoring-stack/exporters-externalsecret.yaml)
#
# Chart: prometheus-community/prometheus-mysql-exporter
# App:   argocd/applications/mysql-exporter.yaml
# =============================================================================

mysql:
  host: "vendure-prod-db.cbq8i48yyklk.ap-south-1.rds.amazonaws.com"
  port: 3306
  db: "wow_vendure"
  user: "admin"
  # This chart expects existingPasswordSecret as a {name,key} map (not a string).
  existingPasswordSecret:
    name: exporter-credentials
    key: DB_PASSWORD

# Scrape via ServiceMonitor (release label makes the kube-prometheus stack pick it up)
serviceMonitor:
  enabled: true
  labels:
    release: prometheus-stack
  interval: 30s
  scrapeTimeout: 10s

service:
  port: 9104
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9104"

# Vendure app nodes can reach the RDS security group; run there.
nodeSelector:
  node-group: app

tolerations: []

resources:
  requests:
    cpu: 20m
    memory: 32Mi
  limits:
    cpu: 100m
    memory: 64Mi
