# =============================================================================
# POD SECURITY STANDARDS (PSS/PSA) - KUBERNETES MANIFESTS
# =============================================================================
# This file contains namespace labels for Pod Security Standards
# 
# Apply with: kubectl apply -f pod-security-standards.yaml
# 
# Or use the setup script: ./setup-pod-security-standards.sh
# =============================================================================

---
# Production Namespace - RESTRICTED (Most Secure)
apiVersion: v1
kind: Namespace
metadata:
  name: vendure-production
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted

---
# Test Namespace - BASELINE (Medium Security)
apiVersion: v1
kind: Namespace
metadata:
  name: vendure-test
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: baseline
    pod-security.kubernetes.io/warn: restricted

---
# Monitoring Namespace - PRIVILEGED (node-exporter needs hostNetwork/hostPID/hostPath)
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged

---
# ArgoCD Namespace - RESTRICTED (all pods run as non-root, no host access needed)
apiVersion: v1
kind: Namespace
metadata:
  name: argocd
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted

---
# Default Namespace - BASELINE
apiVersion: v1
kind: Namespace
metadata:
  name: default
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: baseline
    pod-security.kubernetes.io/warn: restricted

---
# System Namespace - PRIVILEGED (Required for system components)
apiVersion: v1
kind: Namespace
metadata:
  name: kube-system
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged

---
# Public Namespace - BASELINE
apiVersion: v1
kind: Namespace
metadata:
  name: kube-public
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: baseline
    pod-security.kubernetes.io/warn: restricted

---
# Node Lease Namespace - PRIVILEGED (System component)
apiVersion: v1
kind: Namespace
metadata:
  name: kube-node-lease
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged

