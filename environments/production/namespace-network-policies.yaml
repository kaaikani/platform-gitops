# =============================================================================
# Network Policies for Non-Application Namespaces
# =============================================================================
# Default-deny + allow rules for monitoring, argocd, external-secrets,
# kubecost, kyverno, velero, and trivy-system namespaces
# =============================================================================

# ===== MONITORING NAMESPACE =====
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: monitoring
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-monitoring
  namespace: monitoring
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow intra-namespace traffic (Prometheus -> Alertmanager, Grafana, etc.)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
    # Allow ingress from ALB (for Grafana/Prometheus/Alertmanager UIs)
    - ports:
        - port: 3000
          protocol: TCP
        - port: 9090
          protocol: TCP
        - port: 9093
          protocol: TCP
    # Allow metrics scraping from vendure-production
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: vendure-production
  egress:
    # Allow DNS
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # Allow intra-namespace traffic
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
    # Allow Prometheus to scrape metrics from all namespaces (specific ports only)
    - to:
        - namespaceSelector: {}
      ports:
        - port: 80
          protocol: TCP
        - port: 443
          protocol: TCP
        - port: 8001
          protocol: TCP
        - port: 8080
          protocol: TCP
        - port: 8443
          protocol: TCP
        - port: 9090
          protocol: TCP
        - port: 9093
          protocol: TCP
        - port: 9100
          protocol: TCP
        - port: 9115
          protocol: TCP
        - port: 9153
          protocol: TCP
        - port: 3100
          protocol: TCP
        - port: 3200
          protocol: TCP
        - port: 4317
          protocol: TCP
        - port: 4318
          protocol: TCP
        - port: 10250
          protocol: TCP
        - port: 10255
          protocol: TCP
    # Allow HTTPS for Slack webhooks and email (AlertManager notifications)
    - ports:
        - port: 443
          protocol: TCP
        - port: 587
          protocol: TCP

# ===== ARGOCD NAMESPACE =====
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: argocd
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-argocd
  namespace: argocd
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow intra-namespace traffic
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: argocd
    # Allow ALB ingress to ArgoCD server UI
    - ports:
        - port: 8080
          protocol: TCP
        - port: 443
          protocol: TCP
  egress:
    # Allow DNS
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # Allow intra-namespace traffic
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: argocd
    # Allow HTTPS (Git repos, Helm repos, K8s API)
    - ports:
        - port: 443
          protocol: TCP
    # Allow HTTP (for Helm chart repos)
    - ports:
        - port: 80
          protocol: TCP

# ===== EXTERNAL-SECRETS NAMESPACE =====
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: external-secrets
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-external-secrets
  namespace: external-secrets
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow webhook traffic from K8s API server
    - ports:
        - port: 10250
          protocol: TCP
    # Allow metrics scraping from monitoring
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
  egress:
    # Allow DNS
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # Allow HTTPS (AWS Secrets Manager, K8s API)
    - ports:
        - port: 443
          protocol: TCP

# ===== KUBECOST NAMESPACE =====
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: kubecost
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-kubecost
  namespace: kubecost
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow ALB ingress to Kubecost UI
    - ports:
        - port: 9003
          protocol: TCP
        - port: 9090
          protocol: TCP
    # Allow metrics scraping from monitoring
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
  egress:
    # Allow DNS
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # Allow to Prometheus for cost data
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
    # Allow HTTPS (AWS pricing API)
    - ports:
        - port: 443
          protocol: TCP

