# =============================================================================
# PRABASAARI PRODUCTION ENVIRONMENT VALUES
# =============================================================================
# Environment: PRODUCTION (prabasaari-production namespace)
# Purpose: Customer-facing Next.js storefront for Prabasaari brand
# Domain: prabhasaaridesigns.com (root path)
#         /admin and /shop-api are served by vendure-client (separate ingress)
#
# Usage:
#   helm install prabasaari-production ./prabasaari \
#     -n prabasaari-production --create-namespace \
#     -f prabasaari/values.yaml \
#     -f environments/production/prabasaari-values.yaml
# =============================================================================

global:
  namespace: prabasaari-production
  environment: production
  imageRegistry: "149536454380.dkr.ecr.ap-south-1.amazonaws.com/"
namespace:
  create: false # ArgoCD --create-namespace handles it
  name: prabasaari-production
  podSecurity:
    enforce: restricted
    audit: restricted
    warn: restricted
# =============================================================================
# APPLICATION
# =============================================================================
app:
  enabled: true
  replicaCount: 1
  image:
    repository: prabasaaridesigns
    tag: "prabas-v0.1.3"
    pullPolicy: Always
  # Sized like the sibling storefronts on the shared 'storefront' capacity
  # (256Mi request vs ~90Mi observed working set; 768Mi limit for SSR bursts).
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "768Mi"
      cpu: "500m"
  # Surge rollout: on shared capacity there is no single-node budget to protect,
  # so deploys create the replacement pod first and only then remove the old one
  # (zero-downtime, combined with the ALB pod readiness gate on the namespace).
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  service:
    type: ClusterIP
    port: 80
    targetPort: 8004
  # Plain env (no AWS Secrets Manager). VENDURE_API_URL points at the public
  # domain since SSR + browser both call the same Vendure shop-api endpoint.
  env:
    NODE_ENV: production
    PORT: "8004"
    HOSTNAME: "0.0.0.0"
    NEXT_TELEMETRY_DISABLED: "1"
    VENDURE_API_URL: "https://prabhasaaridesigns.com/shop-api"
    GOOGLE_CLIENT_ID: "349081914352-nni3vvjh8kehopt5intedk2vohsmkq48.apps.googleusercontent.com"
    CHANNEL_TOKEN: "prabas-aari"
  podAnnotations:
    reloader.stakater.com/auto: "true"
  securityContext:
    runAsNonRoot: true
    runAsUser: 1001
    fsGroup: 1001
    readOnlyRootFilesystem: false
  terminationGracePeriodSeconds: 30
  dnsPolicy: ClusterFirst
  # Probes hit `/healthz`, a lightweight Next.js route handler that returns
  # immediately and never touches Vendure/Hygraph, so it triggers no SSR load.
  livenessProbe:
    enabled: true
    path: /healthz
    initialDelaySeconds: 60
    periodSeconds: 60
    timeoutSeconds: 10
    failureThreshold: 5
  readinessProbe:
    enabled: true
    path: /healthz
    initialDelaySeconds: 30
    periodSeconds: 30
    timeoutSeconds: 10
    failureThreshold: 5
  startupProbe:
    enabled: true
    path: /healthz
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 10
    failureThreshold: 30
  # HPA: min 2 replicas — this is a client production site on shared capacity
  # (which allows spot), so it must survive a single node loss. 150% of 100m
  # request = 150m sustained before adding a 3rd pod.
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 3
    targetCPUUtilizationPercentage: 150
    behavior:
      scaleUp:
        stabilizationWindowSeconds: 60
        policies:
          - type: Pods
            value: 1
            periodSeconds: 60
      scaleDown:
        stabilizationWindowSeconds: 600 # 10 min — hold extra node only if load persists
        policies:
          - type: Pods
            value: 1
            periodSeconds: 120
  # With 2 replicas a PDB keeping at most 1 pod down protects the site during
  # node drains / spot reclaims / cluster upgrades.
  podDisruptionBudget:
    enabled: true
    maxUnavailable: 1
  # Shared 'storefront' capacity (managed storefront node + Karpenter
  # 'storefront' NodePool) — replaces the dedicated prabasaari-storefront
  # t3a.small NodePool (cost merge, 2026-07-03).
  nodeSelector:
    node-group: storefront
  tolerations: []
  # Soft spread: prefer replicas on different nodes when >1 storefront node
  # exists, but never leave a pod Pending over it (ScheduleAnyway).
  affinity: {}
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app: prabasaari
# =============================================================================
# INGRESS — shared ALB (group.name: vendure-shared)
# Storefront serves '/' on prabhasaaridesigns.com.
# /admin and /shop-api are served by vendure-client's own ingresses on the
# same shared ALB; ALB rule matching prefers the more specific paths.
# =============================================================================
ingress:
  enabled: true
  className: alb
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/group.name: vendure-shared
    # Catch-all '/' rule — must be evaluated AFTER vendure-client's specific
    # paths (/shop-api, /assets, /health, /admin) which use order 100.
    alb.ingress.kubernetes.io/group.order: "1000"
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/certificate-arn: "arn:aws:acm:ap-south-1:149536454380:certificate/b0241105-6298-4092-8733-693a9e69e993"
    alb.ingress.kubernetes.io/healthcheck-path: /healthz
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: "30"
    alb.ingress.kubernetes.io/healthcheck-timeout-seconds: "10"
    alb.ingress.kubernetes.io/healthy-threshold-count: "2"
    alb.ingress.kubernetes.io/unhealthy-threshold-count: "3"
    # `Project` tag intentionally omitted — argocd-server-ingress in this same
    # 'vendure-shared' group already sets Project=argocd, and ALB requires all
    # group members to agree on tag values. Keep only Environment.
    alb.ingress.kubernetes.io/tags: Environment=production
    alb.ingress.kubernetes.io/load-balancer-attributes: idle_timeout.timeout_seconds=60
  hosts:
    - host: prabhasaaridesigns.com
      paths:
        - path: /
          pathType: Prefix
          port: 80
# =============================================================================
# NETWORK POLICIES
# =============================================================================
networkPolicies:
  enabled: true
priorityClassName: ""
