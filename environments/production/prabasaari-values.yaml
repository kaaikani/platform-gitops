# =============================================================================
# PRABASAARI PRODUCTION ENVIRONMENT VALUES
# =============================================================================
# Environment: PRODUCTION (prabasaari-production namespace)
# Purpose: Customer-facing Next.js storefront for Prabasaari brand
# Domain: prabhasaaridesigns.com (root path)
#         /admin and /shop-api are served by vendure-client (separate ingress)
#
# Usage:
#   helm install prabasaari-production ./prabasaari \
#     -n prabasaari-production --create-namespace \
#     -f prabasaari/values.yaml \
#     -f environments/production/prabasaari-values.yaml
# =============================================================================

global:
  namespace: prabasaari-production
  environment: production
  imageRegistry: "149536454380.dkr.ecr.ap-south-1.amazonaws.com/"
namespace:
  create: false # ArgoCD --create-namespace handles it
  name: prabasaari-production
  podSecurity:
    enforce: restricted
    audit: restricted
    warn: restricted
# =============================================================================
# APPLICATION
# =============================================================================
app:
  enabled: true
  replicaCount: 1
  image:
    repository: prabasaaridesigns
    tag: "prabas-v0.0.20"
    pullPolicy: Always
  # Sized for t3a.small co-tenancy with vendure-client (384Mi req / 900Mi limit).
  # Both pods request ~584Mi total — fits inside ~1.4 GiB allocatable on a
  # t3a.small. Limit is burstable; t3a credits cover short SSR spikes.
  resources:
    requests:
      memory: "200Mi"
      cpu: "100m"
    limits:
      memory: "600Mi"
      cpu: "1000m"
  service:
    type: ClusterIP
    port: 80
    targetPort: 8004
  # Plain env (no AWS Secrets Manager). VENDURE_API_URL points at the public
  # domain since SSR + browser both call the same Vendure shop-api endpoint.
  env:
    NODE_ENV: production
    PORT: "8004"
    HOSTNAME: "0.0.0.0"
    NEXT_TELEMETRY_DISABLED: "1"
    VENDURE_API_URL: "https://prabhasaaridesigns.com/shop-api"
    GOOGLE_CLIENT_ID: "349081914352-nni3vvjh8kehopt5intedk2vohsmkq48.apps.googleusercontent.com"
    CHANNEL_TOKEN: "prabas-aari"
  podAnnotations:
    reloader.stakater.com/auto: "true"
  securityContext:
    runAsNonRoot: true
    runAsUser: 1001
    fsGroup: 1001
    readOnlyRootFilesystem: false
  terminationGracePeriodSeconds: 30
  dnsPolicy: ClusterFirst
  # Probes hit `/healthz`, a lightweight Next.js route handler that returns
  # immediately and never touches Vendure/Hygraph, so it triggers no SSR load.
  livenessProbe:
    enabled: true
    path: /healthz
    initialDelaySeconds: 60
    periodSeconds: 60
    timeoutSeconds: 10
    failureThreshold: 5
  readinessProbe:
    enabled: true
    path: /healthz
    initialDelaySeconds: 30
    periodSeconds: 30
    timeoutSeconds: 10
    failureThreshold: 5
  startupProbe:
    enabled: true
    path: /healthz
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 10
    failureThreshold: 30
  # HPA: scales only on real load. 150% of 100m request = 150m sustained
  # before adding a 2nd pod (which forces a 2nd t3a.small via Karpenter).
  # Mirrors the vendure-client philosophy (it uses 200%); slightly more
  # responsive because Next.js SSR gets latency-sensitive faster than the
  # API tier under sustained CPU pressure.
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 2
    targetCPUUtilizationPercentage: 150
    behavior:
      scaleUp:
        stabilizationWindowSeconds: 60
        policies:
          - type: Pods
            value: 1
            periodSeconds: 60
      scaleDown:
        stabilizationWindowSeconds: 600 # 10 min — hold extra node only if load persists
        policies:
          - type: Pods
            value: 1
            periodSeconds: 120
  # Single replica + HPA min=1 means PDB at minAvailable=1 would block voluntary
  # evictions. Disable for parity with vendure-client.
  podDisruptionBudget:
    enabled: false
    maxUnavailable: 1
  # Run on the shared 'vendure-clients' Karpenter NodePool (t3a.small).
  # Co-tenant with the vendure-client backend pod.
  nodeSelector:
    node-group: vendure-clients
  tolerations: []
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchExpressions:
                - key: app
                  operator: In
                  values:
                    - prabasaari
            topologyKey: kubernetes.io/hostname
  topologySpreadConstraints: []
# =============================================================================
# INGRESS — shared ALB (group.name: vendure-shared)
# Storefront serves '/' on prabhasaaridesigns.com.
# /admin and /shop-api are served by vendure-client's own ingresses on the
# same shared ALB; ALB rule matching prefers the more specific paths.
# =============================================================================
ingress:
  enabled: true
  className: alb
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/group.name: vendure-shared
    # Catch-all '/' rule — must be evaluated AFTER vendure-client's specific
    # paths (/shop-api, /assets, /health, /admin) which use order 100.
    alb.ingress.kubernetes.io/group.order: "1000"
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/certificate-arn: "arn:aws:acm:ap-south-1:149536454380:certificate/b0241105-6298-4092-8733-693a9e69e993"
    alb.ingress.kubernetes.io/healthcheck-path: /healthz
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: "30"
    alb.ingress.kubernetes.io/healthcheck-timeout-seconds: "10"
    alb.ingress.kubernetes.io/healthy-threshold-count: "2"
    alb.ingress.kubernetes.io/unhealthy-threshold-count: "3"
    # `Project` tag intentionally omitted — argocd-server-ingress in this same
    # 'vendure-shared' group already sets Project=argocd, and ALB requires all
    # group members to agree on tag values. Keep only Environment.
    alb.ingress.kubernetes.io/tags: Environment=production
    alb.ingress.kubernetes.io/load-balancer-attributes: idle_timeout.timeout_seconds=60
  hosts:
    - host: prabhasaaridesigns.com
      paths:
        - path: /
          pathType: Prefix
          port: 80
# =============================================================================
# NETWORK POLICIES
# =============================================================================
networkPolicies:
  enabled: true
priorityClassName: ""
