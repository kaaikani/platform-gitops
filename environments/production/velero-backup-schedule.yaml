# =============================================================================
# VELERO BACKUP SCHEDULE
# =============================================================================
# Daily backup schedule: 2 AM UTC (7:30 AM IST)
# Retention: 7 days
# Compression: Enabled (via Velero config)
#
# This schedule is created automatically by Velero Helm chart,
# but you can also create it manually with this manifest.
# =============================================================================

apiVersion: velero.io/v1
kind: Schedule
metadata:
  name: daily-backup
  namespace: velero
  labels:
    app: velero
    schedule: daily
spec:
  # Schedule: Daily at 2 AM UTC (7:30 AM IST)
  schedule: "0 2 * * *"
  
  # Template for backups
  template:
    # Include these namespaces
    includedNamespaces:
      - vendure-production
      - monitoring
      - argocd
      - karpenter
      - velero
    
    # Exclude system namespaces
    excludedNamespaces:
      - kube-system
      - kube-public
      - kube-node-lease
      - default
    
    # Include cluster-scoped resources
    includeClusterResources: true
    
    # Snapshot persistent volumes (EBS volumes)
    snapshotVolumes: true
    
    # Use CSI snapshots (better for EKS)
    defaultVolumesToFsBackup: false
    
    # Storage location
    storageLocation: default
    
    # Volume snapshot location
    volumeSnapshotLocations:
      - default
    
    # TTL (retention) - 7 days (matches velero-values.yaml)
    ttl: 168h
    
    # Metadata
    metadata:
      labels:
        schedule: daily
        environment: production
      annotations:
        description: "Daily backup of all production namespaces"
        retention: "7 days"

---
# =============================================================================
# BACKUP RETENTION POLICY (via Velero config)
# =============================================================================
# Velero automatically deletes backups older than TTL
# This is configured in the Schedule above (ttl: 168h = 7 days)
#
# Additional retention can be configured via Velero's backup retention settings
# =============================================================================

