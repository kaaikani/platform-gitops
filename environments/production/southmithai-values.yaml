# =============================================================================
# SOUTHMITHAI PRODUCTION ENVIRONMENT VALUES
# =============================================================================
# Environment: PRODUCTION (southmithai-production namespace)
# Purpose: Customer-facing Remix storefront for South Mithai brand
# Domain: southmithai.com
#
# Usage:
#   helm install southmithai-production ./helm/storefront \
#     -n southmithai-production --create-namespace \
#     -f helm/storefront/values.yaml \
#     -f helm/storefront/values-production.yaml \
#     -f helm/environments/production/southmithai-values.yaml
# =============================================================================

global:
  namespace: southmithai-production
  environment: production
  imageRegistry: "149536454380.dkr.ecr.ap-south-1.amazonaws.com/"
# =============================================================================
# NAMESPACE CONFIGURATION
# =============================================================================
namespace:
  create: false
  name: southmithai-production
  podSecurity:
    enforce: restricted
    audit: restricted
    warn: restricted
# =============================================================================
# STOREFRONT APPLICATION
# =============================================================================
storefront:
  enabled: true
  replicaCount: 2
  # Blue/Green deployment via Argo Rollouts
  blueGreen:
    enabled: true
    autoPromotionEnabled: true
    autoPromotionSeconds: 30
    scaleDownDelaySeconds: 30
    previewReplicaCount: 1
  image:
    repository: southmithai
    tag: "v0.2.0"
    pullPolicy: Always
  # Resource sizing for Remix SSR (Node.js)
  # Actual per pod: 70-215m CPU, ~80Mi RAM (measured 2026-03-02)
  resources:
    requests:
      memory: "256Mi"
      cpu: "150m"
    limits:
      memory: "768Mi"
      cpu: "500m"
  service:
    type: ClusterIP
    port: 80
    targetPort: 8009
  env:
    NODE_ENV: production
    PORT: "8009"
    # Server-side (SSR): internal K8s DNS — <1ms latency, no internet round-trip
    VENDURE_API_URL: "http://vendure-production-vendure-stack-vendure.vendure-production.svc.cluster.local/shop-api"
    # Client-side (browser JS): must use public URL — browser can't reach K8s DNS
    PUBLIC_VENDURE_API_URL: "https://kaaikani.co.in/shop-api"
    HYGRAPH_ENDPOINT: "https://ap-south-1.cdn.hygraph.com/content/cm5c7pe3p012407uvvb6u1yln/master"
  # Secrets — stored in Kubernetes Secret, not in Git
  secrets:
    create: false
    existingSecret: "southmithai-secrets"
  podAnnotations:
    reloader.stakater.com/auto: "true"
  # Health probes
  # Probe periods slowed to reduce Vendure SSR load — each probe hits `/` which
  # runs full Remix loader chain with GraphQL calls.
  livenessProbe:
    enabled: true
    path: /
    initialDelaySeconds: 60
    periodSeconds: 60
    timeoutSeconds: 15
    failureThreshold: 5
  readinessProbe:
    enabled: true
    path: /
    initialDelaySeconds: 30
    periodSeconds: 30
    timeoutSeconds: 10
    failureThreshold: 5
  startupProbe:
    enabled: true
    path: /
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 10
    failureThreshold: 30
  # Autoscaling
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 3
    targetCPUUtilizationPercentage: 75
    targetMemoryUtilizationPercentage: 80
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  # Run on storefront nodes (vendure-prod-storefront-ng-medium nodegroup)
  nodeSelector:
    node-group: storefront
  tolerations: []
  # Spread pods across availability zones (explicit — HPA/Karpenter do not guarantee balance)
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchExpressions:
                - key: app
                  operator: In
                  values:
                    - southmithai
            topologyKey: topology.kubernetes.io/zone
  # Security context
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    fsGroup: 1000
    readOnlyRootFilesystem: true
  terminationGracePeriodSeconds: 30
  enableGracefulShutdown: true
  # Zone: DoNotSchedule = hard guarantee across AZs; Node: ScheduleAnyway = soft spread
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app: southmithai
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app: southmithai
# =============================================================================
# INGRESS CONFIGURATION (AWS ALB)
# =============================================================================
ingress:
  enabled: true
  className: alb
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/group.name: vendure-shared
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/certificate-arn: "arn:aws:acm:ap-south-1:149536454380:certificate/0d120167-6d0c-4ea3-82ad-686e6357c242,arn:aws:acm:ap-south-1:149536454380:certificate/f6551689-c45d-4ea9-80b7-3858423e325d,arn:aws:acm:ap-south-1:149536454380:certificate/98184cbd-d97a-4b23-84f5-42702a7b75e7"
    alb.ingress.kubernetes.io/healthcheck-path: /
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: "30"
    alb.ingress.kubernetes.io/healthcheck-timeout-seconds: "15"
    alb.ingress.kubernetes.io/healthy-threshold-count: "2"
    alb.ingress.kubernetes.io/unhealthy-threshold-count: "3"
    alb.ingress.kubernetes.io/tags: Environment=production
    alb.ingress.kubernetes.io/load-balancer-attributes: idle_timeout.timeout_seconds=60
  hosts:
    - host: southmithai.com
      paths:
        - path: /
          pathType: Prefix
          port: 80
# =============================================================================
# SECURITY
# =============================================================================
networkPolicies:
  enabled: true
# =============================================================================
# PRIORITY CLASS
# =============================================================================
priorityClassName: ""
