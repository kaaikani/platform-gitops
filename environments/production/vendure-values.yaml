# =============================================================================
# VENDURE PRODUCTION ENVIRONMENT VALUES
# =============================================================================
# Environment: PRODUCTION (vendure-production namespace)
# Purpose: Live customer-facing e-commerce platform
#
# Architecture (Recommended):
#   - Vendure on ON-DEMAND instances (reliable, no interruptions)
#   - External RDS MySQL (production database)
#   - External Redis Cloud (production cache)
#   - Monitoring on ON-DEMAND instance (always available)
#
# Usage:
#   kubectl create namespace vendure-production
#   kubectl apply -f vendure-secrets-production.yaml -n vendure-production
#   helm install vendure ./helm/vendure-stack \
#     -n vendure-production \
#     -f helm/environments/production/vendure-values.yaml
#
# Estimated Cost: ~$30-60/month (on-demand instances)
# =============================================================================

global:
  namespace: vendure-production
  environment: production
  # ECR registry
  imageRegistry: "149536454380.dkr.ecr.ap-south-1.amazonaws.com/"
# =============================================================================
# NAMESPACE CONFIGURATION
# =============================================================================
# Note: Use Helm's --create-namespace flag instead of creating manually
# Example: helm install vendure ./helm/vendure-stack -n vendure-production --create-namespace
namespace:
  create: false # Use --create-namespace flag with helm install/upgrade
  name: vendure-production
  podSecurity:
    enforce: restricted # Most secure for production
    audit: restricted
    warn: restricted
# =============================================================================
# VENDURE APPLICATION
# =============================================================================
vendure:
  enabled: true
  replicaCount: 2
  revisionHistoryLimit: 2 # Keep only 2 old ReplicaSets — prevents zombie pods from stale revisions accumulating
  # RollingUpdate strategy: in-place deploys (no node surge)
  # maxSurge: 0 = NEVER create an extra pod during deploy. Required because each
  #   vendure pod requests 1800Mi memory and a c5a.large node fits exactly 2
  #   pods — a 3rd surge pod cannot schedule, and the Karpenter NodePool is not
  #   configured to provision additional `node-group=vendure` nodes. With
  #   surge=1, deploys hung in Pending forever until an old pod was manually
  #   deleted to free node capacity.
  # maxUnavailable: 1 = kill 1 old pod first to free a node slot, then schedule
  #   the new pod into that slot. During deploy, capacity briefly drops to 1
  #   pod; the surviving pod serves traffic via ALB. Acceptable for current
  #   traffic levels (~50–1000 customer req/hr).
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  image:
    repository: vendure-prod
    tag: "devops-v1.0.95"
    pullPolicy: Always
  # Resource sizing based on actual production usage:
  #   - Actual per pod: 770m-1373m CPU, ~1023-1608Mi RAM (kubectl top)
  #   - maxOldSpaceSize: 1400 caused GC thrash (heap hit 1368MB = 98% of cap,
  #     event loop froze → DB health check timed out → 503 → liveness kill).
  #     Raised to 1800: 1800MB heap + ~600MB non-heap = ~2400MB, within 2.5Gi.
  #   - CPU raised 1500m → 2000m: both pods were hitting 1100-1240m and getting
  #     throttled; CPU throttle during GC worsens heap compaction time.
  #   - Reverted from 1200Mi/1500Mi/1000-heap on 2026-05-20 after pods entered
  #     liveness-kill loop — the smaller heap replayed the 2026-05-18 GC-thrash
  #     incident under real load. Single-c5a.large packing is not viable at
  #     observed peak working set (1.5-1.6 GiB per pod).
  resources:
    requests:
      memory: "1800Mi"
      cpu: "600m"
    limits:
      memory: "3Gi"
      cpu: "2000m"
  #   - 2026-06-30: limit 2560Mi → 3Gi, heap 1800 → 2048 as an EMERGENCY STOPGAP
  #     for repeated heap-OOM (exit 139) crashes. Root cause is NOT sizing: the
  #     reporting PWA's fetchAllOrders fires unbounded parallel `orders{lines}`
  #     pulls that load thousands of order lines into the server heap at once.
  #     This bump only reduces crash frequency — the real fix is bounding that
  #     client-side fan-out / moving report aggregation server-side. requests
  #     stay at 1800Mi so node packing (c5a.large) is unchanged; only the burst
  #     ceiling grows.
  # Node.js V8 heap cap (in MiB). Keep ≤ 70% of resources.limits.memory.
  maxOldSpaceSize: 2048
  service:
    type: ClusterIP
    ports:
      server:
        port: 80
      admin:
        port: 3002
  env:
    NODE_ENV: production
    APP_ENV: production
    SUPERADMIN_USERNAME: superadmin
    # Abandoned-cart sweep interval (minutes). Non-secret config toggle.
    # Testing uses 1; production runs the sweep every 30 min.
    ABANDONED_CART_SWEEP_EVERY_MIN: "30"
    # Apple OAuth Bundle IDs (not sensitive — public iOS bundle identifiers)
    APPLE_CLIENT_ID_SOUTHMITHAI: "com.southmithai.southmithai"
    APPLE_CLIENT_ID_SWADKERALA: "com.Swadkerala.Swadkerala"
    APPLE_CLIENT_ID_KAAIKANIDIRECT: "com.kaaikanidirect.kaaikanidirect"
    APPLE_CLIENT_ID_DEFAULT: "com.kaaikani.kaaikani"
    # OpenTelemetry Tracing Configuration
    OTEL_EXPORTER_OTLP_ENDPOINT: "http://tempo.monitoring.svc.cluster.local:4318/v1/traces"
    OTEL_SERVICE_NAME: "vendure"
    OTEL_RESOURCE_ATTRIBUTES: "service.name=vendure,service.version=v1.0.6,deployment.environment=production"
  # Pod annotations for Prometheus scraping
  podAnnotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "80"
    prometheus.io/path: "/metrics"
  # Health checks — tolerant of brief DB latency spikes (Vendure internal DB
  # health check has a 1000ms timeout; under heavy load the event loop can
  # delay the check beyond 1s, returning 503 temporarily).
  # -------------------------------------------------------------------------
  # Health Probes — proper DevOps configuration for zero-downtime
  # -------------------------------------------------------------------------
  # Startup: handles slow boot (DB migrations, admin UI compile). Liveness and
  #   readiness are DISABLED until startup succeeds → no premature kills.
  # Liveness: only restarts TRULY dead pods. Uses a TCP port check (NOT /health)
  #   on purpose. Verified 2026-06-16: RDS is calm (66/67 conns idle, no slow/
  #   locked queries), yet /health returns "database down: timeout 1000ms" — that
  #   is the Node event loop freezing (GC/sync work) tripping the 1000ms timer,
  #   NOT the DB. An httpGet /health liveness therefore SIGKILLs healthy pods on
  #   a brief freeze, dropping capacity and cascading. A TCP check confirms the
  #   process is alive without depending on the event loop completing a DB query.
  #   Transient freezes are handled by readiness (pulls from ALB, no restart).
  # Readiness: controls traffic routing. KEEPS /health (DB-aware). A TCP-only
  #   readiness was tried 2026-06-17 and REVERTED the same day — it BACKFIRED:
  #   with only 2 schedulable pods, a hard event-loop freeze (port open but
  #   /health TIMEOUT) left the frozen pod marked Ready + in the ALB, serving
  #   timeouts to ~50% of traffic until the ALB's own /health pulled it at 60s
  #   → real outage. Lesson: at 2-pod capacity, pulling a frozen pod fast and
  #   routing 100% to the healthy pod (one c5a.large absorbs both short-term at
  #   ~750-1030m of the 2000m limit) is LESS bad than serving 50% errors. So
  #   readiness stays DB-aware /health. (Liveness stays TCP — see note above —
  #   because a SIGKILL+reschedule is far more disruptive than an ALB pull.)
  #   The load-concentration cascade this was meant to avoid is only truly
  #   fixed app-side: index fulfillment.customFieldsDeliverypersonid + raise
  #   Vendure's 1000ms DB-health timeout (delivery-partner queries are the load
  #   source). ALB unhealthy-threshold kept at 4 (60s) to let in-flight drain.
  # -------------------------------------------------------------------------
  livenessProbe:
    enabled: true
    tcpSocket: true # check port is open; do NOT hit /health (see note above)
    path: /health # retained for reference; ignored when tcpSocket=true
    initialDelaySeconds: 120
    periodSeconds: 30
    timeoutSeconds: 10
    failureThreshold: 10 # 10 consecutive failures = 5 min before kill
  readinessProbe:
    enabled: true
    tcpSocket: false # DB-aware /health — pull a frozen pod fast (see note above; TCP backfired 2026-06-17)
    path: /health
    initialDelaySeconds: 0 # startup probe handles boot; no extra delay needed
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6 # 6 failures = 60s before removing from service (was 3 = 30s)
  # Enable autoscaling for production
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 4
    # 150% of 600m request = 900m actual usage triggers scale-up.
    targetCPUUtilizationPercentage: 150
    # Memory metric intentionally DISABLED (2026-06-01).
    #   Node.js with maxOldSpaceSize=1800 deliberately grows and HOLDS V8 old
    #   space near 1800Mi, so memory working set sits at ~90-100% of the 1800Mi
    #   request once a pod warms up. An 80% memory target is therefore exceeded
    #   permanently → HPA pins itself at maxReplicas and demands pods that
    #   cannot schedule (the 2-node vendure pool fits 1 pod/node; Karpenter does
    #   not provision more node-group=vendure nodes). Result was 2 pods stuck
    #   Pending indefinitely. CPU is the correct scaling signal for this app.
    #   Explicit null deletes the chart default (vendure-stack/values.yaml:125),
    #   which Helm would otherwise re-supply if this key were merely omitted.
    targetMemoryUtilizationPercentage: null
    # HPA behavior configuration for controlled scaling
    behavior:
      scaleUp:
        stabilizationWindowSeconds: 0 # React immediately to CPU spikes
        policies:
          - type: Pods
            value: 2
            periodSeconds: 30 # Add 2 pods per 30 seconds
      scaleDown:
        stabilizationWindowSeconds: 300 # Wait 5 minutes before scaling down (prevents flapping)
        policies:
          - type: Pods
            value: 1
            periodSeconds: 60 # Remove 1 pod per minute when CPU drops
            # Custom metrics via Prometheus Adapter (request-based scaling)
            # Disabled — these metrics are not available from the custom metrics API.
            # To enable, first configure Prometheus Adapter rules for these metrics:
            #   helm install prometheus-adapter prometheus-community/prometheus-adapter
            #   -n monitoring -f helm/environments/production/prometheus-adapter-values.yaml
            # Then uncomment:
            # customMetrics:
            #   - type: Pods
            #     pods:
            #       metric:
            #         name: http_requests_per_second
            #       target:
            #         type: AverageValue
            #         averageValue: "100"
            #   - type: Pods
            #     pods:
            #       metric:
            #         name: http_request_duration_seconds_p95
            #       target:
            #         type: AverageValue
            #         averageValue: "500m"
  podDisruptionBudget:
    enabled: true
    minAvailable: 1 # Always keep at least 1 pod running during disruptions
  # Run on ON-DEMAND instances (reliable, no interruptions)
  # Changed from spot to on-demand for better reliability and graceful handling of disruptions
  nodeSelector:
    node-group: vendure
  # No tolerations needed for on-demand instances
  tolerations: []
  # Pack vendure pods on the SAME node (cost-optimized: 1 c5a.large handles 2 pods + worker)
  # podAffinity tells scheduler: prefer placing new pods where existing vendure pods are.
  # Karpenter will only launch a 2nd node when HPA scales beyond what 1 node can fit.
  affinity:
    podAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchExpressions:
                - key: app
                  operator: In
                  values:
                    - vendure
            topologyKey: kubernetes.io/hostname
  # Security context (run as non-root user)
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    fsGroup: 1000
    readOnlyRootFilesystem: false # Disabled until writable paths are fully mapped
  # -------------------------------------------------------------------------
  # Graceful Shutdown — prevents 502s during deploys
  # -------------------------------------------------------------------------
  # Sequence: SIGTERM → preStop sleep(15) → ALB deregisters (15-30s) → app drains
  # terminationGracePeriod MUST be > preStop + drain time (15 + 30 = 45s, use 60s)
  # -------------------------------------------------------------------------
  terminationGracePeriodSeconds: 60
  enableGracefulShutdown: true
  lifecycle:
    preStop:
      exec:
        # Sleep 15s: gives ALB time to stop sending new requests to this pod.
        # Without this, ALB sends traffic to a pod that's already shutting down → 502.
        command: ["/bin/sh", "-c", "sleep 15"]
  # Startup probe — gates liveness/readiness until app is fully booted
  # Vendure boot: image pull + init container + Node.js start + DB connect + migrations
  # Total: 30-120s typical. Allow up to 5 min (failureThreshold × periodSeconds).
  startupProbe:
    enabled: true
    path: /health
    initialDelaySeconds: 10
    periodSeconds: 5 # check every 5s (faster detection when app is ready)
    timeoutSeconds: 5
    failureThreshold: 60 # 60 × 5s = 5 min max boot time
    # -------------------------------------------------------------------------
    # TopologySpreadConstraints — intentionally removed (2026-04-24)
    # -------------------------------------------------------------------------
    # Previously spread pods 1-per-node (soft). Removed because:
    #   1. We are pinned to a single AZ (ap-south-1a, same as RDS) — host-level
    #      spread only protects against single-node death, not AZ failure.
    #   2. The spread rule fought podAffinity (co-location) during Karpenter
    #      consolidation: after a deploy surge spawned a 2nd node, pods stayed
    #      1-per-node and Karpenter refused to consolidate → steady-state 2
    #      nodes → ~$56/month wasted.
    # With spread removed, Karpenter consolidates back to 1 node ~5 min after
    # any surge (deploy or HPA spike). Trade-off: if that 1 node dies, both
    # pods die together → ~60-90s downtime while Karpenter provisions a
    # replacement. Acceptable at current stage (single-AZ anyway, stateless
    # app, cost pressure). Revisit when multi-AZ is justified by revenue/SLA.
    # -------------------------------------------------------------------------
# =============================================================================
# DATABASE CONFIGURATION
# =============================================================================

# Disable in-cluster MySQL - Using Amazon RDS
mysql:
  enabled: false
# External Amazon RDS MySQL (Production Database)
# IMPORTANT: Use a separate RDS instance for production!
externalDatabase:
  enabled: true
  host: "" # Not used — DB_HOST read from vendure-secrets (AWS Secrets Manager)
  port: 3306
  database: "" # Not used — DB_NAME read from vendure-secrets (AWS Secrets Manager)
  username: admin
  existingSecret: "vendure-secrets"
  existingSecretPasswordKey: "DB_PASSWORD"
# =============================================================================
# REDIS CONFIGURATION
# =============================================================================

# Disable in-cluster Redis - Using Redis Cloud
redis:
  enabled: false
# External Redis Cloud (Production)
externalRedis:
  enabled: true
  host: "" # Not used — REDIS_HOST read from vendure-secrets (AWS Secrets Manager)
  port: 6379
  username: "default"
  existingSecret: "vendure-secrets"
  existingSecretPasswordKey: "REDIS_PASSWORD"
# =============================================================================
# AWS S3 CONFIGURATION (Asset Storage)
# =============================================================================
s3:
  enabled: true
  bucket: "cdn.kaaikani.co.in"
  region: "ap-south-1"
  # Pin to global endpoint to preserve pre-existing behavior. The chart now
  # reads S3_ENDPOINT from this value instead of the AWS Secret. Without this
  # line the chart would compute the regional endpoint
  # (https://s3.ap-south-1.amazonaws.com) which technically works but changes
  # production behavior.
  endpoint: "https://s3.amazonaws.com"
  assetPath: "assets/" # Production assets path
  # SECURITY: Use IRSA (IAM Roles for Service Accounts) instead of access keys
  useIRSA: false # Reverted — Vendure S3 plugin code passes explicit credentials object to AWS SDK, which fails with IRSA. To enable IRSA, modify Vendure S3AssetStorageStrategy config to omit the credentials block and let SDK auto-discover.
  existingSecret: "vendure-secrets"
  accessKeyIdKey: "AWS_ACCESS_KEY_ID" # Only used if useIRSA: false
  secretAccessKeyKey: "AWS_SECRET_ACCESS_KEY" # Only used if useIRSA: false
# =============================================================================
# MONITORING CONFIGURATION
# =============================================================================
prometheus:
  enabled: false
  server:
    enabled: false
  pushgateway:
    enabled: false
  nodeExporter:
    enabled: false
  kubeStateMetrics:
    enabled: false
grafana:
  enabled: false
# ServiceMonitor for external Prometheus
serviceMonitor:
  enabled: true
  namespace: monitoring
  interval: 15s # More frequent for production
  scrapeTimeout: 10s
  labels:
    release: prometheus-stack
# PrometheusRule for production alerts (CRITICAL severity)
prometheusRule:
  enabled: true
  namespace: monitoring
  labels:
    release: prometheus-stack
  rules:
    - alert: VendureProductionDown
      expr: up{job=~".*vendure.*", namespace="vendure-production"} == 0
      for: 1m
      labels:
        severity: critical
        environment: production
      annotations:
        summary: "Vendure API is DOWN (not responding for 1 min)"
        description: "The /health endpoint is returning errors or timing out"
        cause: "Pod crashed, DB connection lost, or Karpenter node failed"
        fix: "kubectl get pods -n vendure-production; kubectl logs -n vendure-production deploy/vendure-production-vendure-stack-vendure --tail=100"
    - alert: VendureProductionHighErrorRate
      expr: rate(http_requests_total{namespace="vendure-production",status=~"5.."}[5m]) > 0.05
      for: 3m
      labels:
        severity: critical
        environment: production
      annotations:
        summary: "5xx error rate above 5% for 3 minutes"
        description: "More than 5% of requests are returning HTTP 500-level errors"
        cause: "DB timeout, upstream service failure, or application bug in recent deploy"
        fix: "Check recent deploys in ArgoCD. Check DB latency in Grafana. Rollback if needed: kubectl rollout undo deploy/vendure-production-vendure-stack-vendure -n vendure-production"
    - alert: VendureProductionHighLatency
      expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket{namespace="vendure-production"}[5m])) > 2
      for: 5m
      labels:
        severity: warning
        environment: production
      annotations:
        summary: "P95 latency above 2 seconds for 5 minutes"
        description: "95th percentile request time exceeds 2s"
        cause: "Usually RDS CPU credits exhausted (db.t3.small is throttled). Can also be slow queries or Redis issues."
        fix: "Check RDS CPU credits in CloudWatch. Upgrade to db.t3.medium if credits are 0. Check slow queries in RDS Performance Insights."
    - alert: VendureProductionOOMRisk
      expr: |
        container_memory_usage_bytes{namespace="vendure-production",container="vendure"}
        / container_spec_memory_limit_bytes{namespace="vendure-production",container="vendure"} > 0.9
      for: 3m
      labels:
        severity: critical
        environment: production
      annotations:
        summary: "Pod memory usage above 90% of limit"
        description: "Pod is about to be OOMKilled by the kernel"
        cause: "Memory leak, large DB query result, or asset upload spike"
        fix: "Identify leak via kubectl top pods. Increase limit in vendure-values.yaml if consistent high usage. Restart pod: kubectl rollout restart deploy/vendure-production-vendure-stack-vendure -n vendure-production"
    - alert: VendureProductionAllPodsDown
      expr: count(up{job=~".*vendure.*", namespace="vendure-production"} == 1) == 0
      for: 30s
      labels:
        severity: critical
        environment: production
      annotations:
        summary: "ALL Vendure pods are DOWN — complete outage"
        description: "Zero healthy pods running in vendure-production namespace"
        cause: "Karpenter node failure, bad deploy, or cluster-wide issue"
        fix: "URGENT: kubectl get pods -n vendure-production; kubectl describe nodes; rollback if recent deploy"
# =============================================================================
# INGRESS CONFIGURATION (AWS ALB)
# =============================================================================
ingress:
  enabled: true
  className: alb
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/group.name: vendure-shared
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/certificate-arn: "arn:aws:acm:ap-south-1:149536454380:certificate/0d120167-6d0c-4ea3-82ad-686e6357c242,arn:aws:acm:ap-south-1:149536454380:certificate/f6551689-c45d-4ea9-80b7-3858423e325d,arn:aws:acm:ap-south-1:149536454380:certificate/48b6176f-9f3c-481b-bcde-07b0ad193c2c"
    alb.ingress.kubernetes.io/healthcheck-path: /health
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: "15"
    alb.ingress.kubernetes.io/healthcheck-timeout-seconds: "5"
    alb.ingress.kubernetes.io/healthy-threshold-count: "2"
    # unhealthy-threshold 2→4 (2026-06-17): with target-type=ip the ALB runs its
    # OWN /health probe and stops routing independently of K8s readiness. At 2×15s
    # it deregistered a target after only 30s of a (false) "DB down" freeze, undoing
    # the TCP-readiness change above and re-creating the load-concentration cascade.
    # 4×15s = 60s tolerates a transient event-loop freeze (both pods keep serving
    # degraded); healthy-threshold stays 2 (30s) for fast re-add on recovery.
    alb.ingress.kubernetes.io/unhealthy-threshold-count: "4"
    # Production specific
    alb.ingress.kubernetes.io/tags: Environment=production
    alb.ingress.kubernetes.io/load-balancer-attributes: idle_timeout.timeout_seconds=60
    # Deregistration delay: ALB waits 30s for in-flight requests to complete
    # before removing a target. Works with preStop sleep(15) to prevent 502s.
    alb.ingress.kubernetes.io/target-group-attributes: deregistration_delay.timeout_seconds=30
    # WAF: Handled by Cloudflare (upstream proxy) — AWS WAF not needed
    # If migrating off Cloudflare, enable AWS WAF:
    # alb.ingress.kubernetes.io/wafv2-acl-arn: "arn:aws:elasticloadbalancing:..."
  adminUi:
    enabled: true
  hosts:
    - host: kaaikani.co.in
      paths:
        # Vendure Dashboard (v3.3+) — served by the main server process on
        # port 80 at /dashboard. Listed explicitly (ALB evaluates more
        # specific paths before the catch-all '/' below).
        - path: /dashboard
          pathType: Prefix
          service: vendure
          port: 80
        - path: /
          pathType: Prefix
          service: vendure
          port: 80
# =============================================================================
# SECURITY CONFIGURATION
# =============================================================================
networkPolicies:
  enabled: true # Enable for production security
  # Allow storefront apps (SSR pods) to reach Vendure shop-api across namespaces
  allowedNamespaces:
    - storefront-production
    - swadkerala-production
    - southmithai-production
# =============================================================================
# SECRETS MANAGEMENT - AWS Secrets Manager
# =============================================================================
# Using AWS Secrets Manager with External Secrets Operator
# See: docs/AWS-SECRETS-MANAGER-SETUP.md for setup instructions
secrets:
  create: false # External Secrets Operator will create the secret
  existingSecret: "vendure-secrets" # Created by External Secrets Operator
# External Secrets Operator Configuration
externalSecrets:
  enabled: true
  createSecretStore: false # Using existing ClusterSecretStore
  clusterSecretStore: aws-secrets-manager
  refreshInterval: 1m # Fast sync for rotation — AWS API cost ~$0.007/month extra vs 15m
  awsSecrets:
    database: "vendure/prod/database"
    redis: "vendure/prod/redis"
    awsS3: "vendure/prod/aws-s3"
    smtps: "vendure/prod/smtps"
    integrations: "vendure/prod/integrations"
serviceAccount:
  create: true
  annotations:
    # For AWS IAM Roles for Service Accounts (IRSA)
    # IMPORTANT: Create IAM role first using eksctl or AWS CLI, then uncomment and update ARN below
    # eksctl create iamserviceaccount --name vendure-sa --namespace vendure-production \
    #   --cluster vendure-cluster --attach-policy-arn arn:aws:iam::aws:policy/AmazonS3FullAccess \
    #   --approve --override-existing-serviceaccounts
    eks.amazonaws.com/role-arn: arn:aws:iam::149536454380:role/vendure-production-role
    # TODO: Replace above ARN with actual IAM role ARN after creating service account
# =============================================================================
# VENDURE WORKER (Background Job Processing)
# =============================================================================
# Runs a separate worker process for background jobs (emails, search indexing,
# payment webhooks, asset processing). Keeps API pods responsive.
worker:
  enabled: true
  replicaCount: 1
  resources:
    requests:
      memory: "384Mi"
      cpu: "100m"
    limits:
      memory: "1024Mi"
      cpu: "500m"
  nodeSelector:
    node-group: vendure
  # Same AZ spread as Vendure server (when replicaCount >= 2)
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchExpressions:
                - key: app
                  operator: In
                  values:
                    - vendure-worker
            topologyKey: topology.kubernetes.io/zone
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app: vendure-worker
# =============================================================================
# VENDURE PRIORITY CLASS
# =============================================================================
# Ensures Vendure pods are not evicted before monitoring during resource pressure
priorityClassName: vendure-critical
# =============================================================================
# RBAC (Role-Based Access Control)
# =============================================================================
# Three-tier access model:
#   - developers: Read-only (view pods, logs, services - no secrets)
#   - devops: Full CRUD (cannot delete namespace or modify RBAC)
#   - readOnly: View-only (for managers/auditors - no secrets access)
#
# Users should map to IAM users configured via:
#   helm/environments/production/configure-rbac-users.sh
# =============================================================================
rbac:
  enabled: true
  # Developers - Read-only access to namespace resources
  # Can view: pods, logs, services, configmaps, deployments, HPA
  # Cannot: create, update, delete anything or view secrets
  developers:
    - dev@kaaikani.co.in
