{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "vendure-stack.fullname" . }}
  labels:
    {{- include "vendure-stack.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- range .Values.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ if .useStable }}vendure-stable{{ else }}{{ include "vendure-stack.fullname" $ }}-{{ .service }}{{ end }}
                port:
                  number: {{ .port }}
          {{- end }}
    {{- end }}
---
{{- if .Values.ingress.adminUi.enabled }}
# Separate ingress for Admin UI (port 3002) with its own health check
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "vendure-stack.fullname" . }}-admin
  labels:
    {{- include "vendure-stack.labels" . | nindent 4 }}
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/group.name: vendure-shared
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/certificate-arn: {{ index .Values.ingress.annotations "alb.ingress.kubernetes.io/certificate-arn" | quote }}
    alb.ingress.kubernetes.io/healthcheck-path: /admin
    alb.ingress.kubernetes.io/healthcheck-port: "3002"
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          - path: /admin
            pathType: Prefix
            backend:
              service:
                name: {{ include "vendure-stack.fullname" $ }}-vendure
                port:
                  number: 3002
    {{- end }}
{{- end }}
{{- end }}
