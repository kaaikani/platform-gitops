{{- if and .Values.secrets.create (not .Values.externalSecrets.enabled) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "vendure-stack.secretName" . }}
  labels:
    {{- include "vendure-stack.labels" . | nindent 4 }}
type: Opaque
data:
  # Database credentials (using uppercase keys as expected by deployment)
  {{- if .Values.externalDatabase }}
  {{- if .Values.externalDatabase.enabled }}
  {{- if .Values.externalDatabase.username }}
  DB_USERNAME: {{ .Values.externalDatabase.username | b64enc | quote }}
  {{- end }}
  {{- if .Values.externalDatabase.password }}
  DB_PASSWORD: {{ .Values.externalDatabase.password | b64enc | quote }}
  {{- else if .Values.externalDatabase.existingSecret }}
  # Password comes from existingSecret, but we still need DB_USERNAME
  {{- if .Values.externalDatabase.username }}
  DB_USERNAME: {{ .Values.externalDatabase.username | b64enc | quote }}
  {{- end }}
  {{- end }}
  {{- end }}
  {{- else if .Values.mysql.enabled }}
  # Using in-cluster MySQL - get credentials from mysql values
  DB_USERNAME: {{ .Values.mysql.auth.username | default "vendure" | b64enc | quote }}
  DB_PASSWORD: {{ .Values.mysql.auth.password | default "vendure123" | b64enc | quote }}
  DB_ROOT_PASSWORD: {{ .Values.mysql.auth.rootPassword | default "root123" | b64enc | quote }}
  {{- else }}
  # Default database credentials
  DB_USERNAME: {{ "vendure" | b64enc | quote }}
  DB_PASSWORD: {{ .Values.secrets.database.password | b64enc | quote }}
  DB_ROOT_PASSWORD: {{ .Values.secrets.database.rootPassword | b64enc | quote }}
  {{- end }}

  # Redis credentials (if needed)
  {{- if .Values.externalRedis }}
  {{- if .Values.externalRedis.username }}
  REDIS_USERNAME: {{ .Values.externalRedis.username | b64enc | quote }}
  {{- end }}
  {{- if .Values.externalRedis.password }}
  REDIS_PASSWORD: {{ .Values.externalRedis.password | b64enc | quote }}
  {{- else if .Values.externalRedis.existingSecret }}
  # Password comes from existingSecret, but we still need username if provided
  {{- if .Values.externalRedis.username }}
  REDIS_USERNAME: {{ .Values.externalRedis.username | b64enc | quote }}
  {{- end }}
  {{- end }}
  {{- end }}

  # Vendure secrets
  COOKIE_SECRET: {{ .Values.secrets.vendure.cookieSecret | b64enc | quote }}
  SUPERADMIN_USERNAME: {{ .Values.vendure.env.SUPERADMIN_USERNAME | default "superadmin" | b64enc | quote }}
  SUPERADMIN_PASSWORD: {{ .Values.secrets.vendure.superadminPassword | b64enc | quote }}
  RAZORPAY_WEBHOOK_SECRET: {{ .Values.secrets.vendure.razorpayWebhookSecret | default "" | b64enc | quote }}
  {{- if .Values.secrets.vendure.totpSalt }}
  TOTP_SALT: {{ .Values.secrets.vendure.totpSalt | b64enc | quote }}
  {{- else }}
  TOTP_SALT: {{ "local-dev-totp-salt-change-me" | b64enc | quote }}
  {{- end }}

  # South Mithai SMTP Configuration (local dev defaults)
  SOUTHMITHAI_SMTP_HOST: {{ "localhost" | b64enc | quote }}
  SOUTHMITHAI_SMTP_PORT: {{ "587" | b64enc | quote }}
  SOUTHMITHAI_SMTP_SECURE: {{ "false" | b64enc | quote }}
  SOUTHMITHAI_SMTP_USERNAME: {{ "" | b64enc | quote }}
  SOUTHMITHAI_SMTP_PASSWORD: {{ "" | b64enc | quote }}
  SOUTHMITHAI_EMAIL_FROM: {{ "noreply@localhost" | b64enc | quote }}
  SOUTHMITHAI_SHOP_URL: {{ "http://localhost:8001" | b64enc | quote }}

  # Swad Kerala SMTP Configuration (local dev defaults)
  SWADKERALA_SMTP_HOST: {{ "localhost" | b64enc | quote }}
  SWADKERALA_SMTP_PORT: {{ "587" | b64enc | quote }}
  SWADKERALA_SMTP_SECURE: {{ "false" | b64enc | quote }}
  SWADKERALA_SMTP_USERNAME: {{ "" | b64enc | quote }}
  SWADKERALA_SMTP_PASSWORD: {{ "" | b64enc | quote }}
  SWADKERALA_EMAIL_FROM: {{ "noreply@localhost" | b64enc | quote }}
  SWADKERALA_SHOP_URL: {{ "http://localhost:8001" | b64enc | quote }}

  # Shipping Provider Credentials (local dev - empty defaults)
  BLUEDART_CLIENT_ID: {{ "" | b64enc | quote }}
  BLUEDART_CLIENT_SECRET: {{ "" | b64enc | quote }}
  SHIPROCKET_EMAIL: {{ "" | b64enc | quote }}
  SHIPROCKET_PASSWORD: {{ "" | b64enc | quote }}

  # Google OAuth (local dev - empty default)
  GOOGLE_CLIENT_ID: {{ "" | b64enc | quote }}

  # Apple OAuth (local dev - empty defaults)
  APPLE_CLIENT_ID_SOUTHMITHAI: {{ "" | b64enc | quote }}
  APPLE_CLIENT_ID_SWADKERALA: {{ "" | b64enc | quote }}
  APPLE_CLIENT_ID_DEFAULT: {{ "" | b64enc | quote }}

  # Anthropic API (local dev - empty default; worker reads this)
  ANTHROPIC_API_KEY: {{ "" | b64enc | quote }}

  # AWS S3 credentials (optional; populated from values when provided)
  {{- if .Values.secrets.aws }}
  AWS_ACCESS_KEY_ID: {{ .Values.secrets.aws.accessKeyId | default "" | b64enc | quote }}
  AWS_SECRET_ACCESS_KEY: {{ .Values.secrets.aws.secretAccessKey | default "" | b64enc | quote }}
  AWS_REGION: {{ .Values.secrets.aws.region | default "ap-south-1" | b64enc | quote }}
  S3_BUCKET: {{ .Values.secrets.aws.bucket | default "" | b64enc | quote }}
  S3_ENDPOINT: {{ .Values.secrets.aws.endpoint | default "https://s3.amazonaws.com" | b64enc | quote }}
  {{- end }}
{{- end }}
