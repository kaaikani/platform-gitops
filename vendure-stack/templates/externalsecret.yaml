{{- if .Values.externalSecrets.enabled }}
{{- if .Values.externalSecrets.createSecretStore }}
---
# SecretStore defines how to connect to AWS Secrets Manager
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: {{ include "vendure-stack.fullname" . }}-aws-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vendure-stack.labels" . | nindent 4 }}
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ .Values.externalSecrets.aws.region | default "ap-south-1" }}
      auth:
        jwt:
          serviceAccountRef:
            name: {{ .Values.externalSecrets.serviceAccountName | default "external-secrets" }}
---
{{- end }}
# ExternalSecret syncs secrets from AWS Secrets Manager to Kubernetes
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "vendure-stack.secretName" . }}-external
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vendure-stack.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval | default "1h" }}
  secretStoreRef:
    {{- if .Values.externalSecrets.clusterSecretStore }}
    name: {{ .Values.externalSecrets.clusterSecretStore }}
    kind: ClusterSecretStore
    {{- else }}
    name: {{ include "vendure-stack.fullname" . }}-aws-secrets
    kind: SecretStore
    {{- end }}
  target:
    name: {{ include "vendure-stack.secretName" . }}
    creationPolicy: Owner
  dataFrom:
    # Database credentials (DB_HOST, DB_PORT, DB_NAME, DB_USERNAME, DB_PASSWORD)
    - extract:
        key: {{ .Values.externalSecrets.awsSecrets.database | default "vendure/prod/database" }}
    # Redis credentials (REDIS_HOST, REDIS_PORT, REDIS_USERNAME, REDIS_PASSWORD)
    - extract:
        key: {{ .Values.externalSecrets.awsSecrets.redis | default "vendure/prod/redis" }}
    # AWS S3 credentials (AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_REGION, S3_ENDPOINT, S3_BUCKET)
    - extract:
        key: {{ .Values.externalSecrets.awsSecrets.awsS3 | default "vendure/prod/aws-s3" }}
    # SMTP credentials for all brands
    - extract:
        key: {{ .Values.externalSecrets.awsSecrets.smtps | default "vendure/prod/smtps" }}
    # Third-party integrations (Bluedart, Shiprocket, Google, Apple)
    - extract:
        key: {{ .Values.externalSecrets.awsSecrets.integrations | default "vendure/prod/integrations" }}
---
# ExternalSecret for vendure-app-secrets (COOKIE_SECRET, SUPERADMIN, TOTP, Razorpay)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.appSecrets.name | default "vendure-app-secrets" }}-external
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vendure-stack.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval | default "1h" }}
  secretStoreRef:
    {{- if .Values.externalSecrets.clusterSecretStore }}
    name: {{ .Values.externalSecrets.clusterSecretStore }}
    kind: ClusterSecretStore
    {{- else }}
    name: {{ include "vendure-stack.fullname" . }}-aws-secrets
    kind: SecretStore
    {{- end }}
  target:
    name: {{ .Values.appSecrets.name | default "vendure-app-secrets" }}
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: {{ .Values.externalSecrets.awsSecrets.integrations | default "vendure/prod/integrations" }}
{{- end }}
