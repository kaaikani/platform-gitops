# =============================================================================
# Karpenter NodePool - Application Workloads (TEST Environment)
# =============================================================================
# Purpose: Auto-provision spot instances for Vendure application pods
# Environment: TEST
# Strategy: Minimal cost with spot instances
# =============================================================================

apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: application-test
spec:
  # Node Template
  template:
    metadata:
      labels:
        # These labels match the nodeSelector in vendure-test values
        node-group: app
        workload: vendure
        environment: test
        node-type: on-demand
    spec:
      # Instance Requirements
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]

        - key: kubernetes.io/os
          operator: In
          values: ["linux"]

        # AZ constraint — restrict to AZs with Karpenter-tagged subnets
        - key: topology.kubernetes.io/zone
          operator: In
          values: ["ap-south-1a", "ap-south-1b", "ap-south-1c"]

        # On-demand for test (same as production mirror — no spot instability)
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"]

        # c5a.large: 2 vCPU / 4GB — compute-optimized AMD (2nd gen), consistent CPU (no bursting)
        # large only — ensures each pod gets a dedicated-class node
        - key: karpenter.k8s.aws/instance-family
          operator: In
          values: ["c5a"]

        - key: karpenter.k8s.aws/instance-size
          operator: In
          values: ["large"]

        - key: karpenter.k8s.aws/instance-generation
          operator: Gt
          values: ["2"]

      # Reference to EC2NodeClass
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: default-test

      # Node expiry - Replace nodes every 7 days (test environment)
      expireAfter: 168h  # 7 days

  # Resource Limits for this NodePool (MINIMAL for test)
  limits:
    cpu: 16         # Max 16 vCPUs total (up to 8 c5a.large instances)
    memory: 32Gi    # Max 32GB RAM total

  # Disruption Settings
  disruption:
    # Only disrupt 1 node at a time (10% rounds to 0 with 1 node)
    budgets:
      - nodes: "1"
    # Consolidate aggressively for cost savings
    consolidationPolicy: WhenEmptyOrUnderutilized
    # Wait 30 seconds before consolidating (test environment)
    consolidateAfter: 60s

  # Priority weight (lower than production)
  weight: 50

