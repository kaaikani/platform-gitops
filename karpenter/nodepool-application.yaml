apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: application
spec:
  # Node Template
  template:
    metadata:
      labels:
        node-type: on-demand
        workload: vendure
        cost-tier: budget
        node-group: vendure
    spec:
      # Instance Requirements
      requirements:
        # Architecture
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]

        # Operating System
        - key: kubernetes.io/os
          operator: In
          values: ["linux"]

        # Capacity Type - ON-DEMAND only for Vendure reliability
        # Changed from spot to on-demand to prevent service disruptions
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"]

        # c5a.large: 2 vCPU / 4GB — compute-optimized AMD (2nd gen), consistent CPU (no bursting)
        - key: karpenter.k8s.aws/instance-family
          operator: In
          values: ["c5a"]

        # large only — each pod gets a dedicated compute-class node
        - key: karpenter.k8s.aws/instance-size
          operator: In
          values: ["large"]

        # Instance Generation - t3, m5, c5 or newer
        - key: karpenter.k8s.aws/instance-generation
          operator: Gt
          values: ["2"]

        # Pin to ap-south-1a — same AZ as RDS (vendure-prod-db)
        # Eliminates cross-AZ latency on every DB query (+1-3ms per call)
        - key: topology.kubernetes.io/zone
          operator: In
          values: ["ap-south-1a"]

      # Reference to EC2NodeClass
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: default

      # Node expiry - Replace nodes every 30 days for security patches
      expireAfter: 720h

  # ONE c5a.large. Combined with the 1-node cap on `application-spot`, the
  # application tier can never exceed 2 nodes total.
  #
  # NOTE: memory is the binding limit, not cpu. c5a.large reports ~3.75Gi, so
  # 4Gi fits exactly one node. The old `cpu: 6 = 3 nodes` comment was wrong —
  # memory capped it at 2 long before cpu ever bound.
  #
  # Safe for deploys: the vendure Deployment runs maxSurge=0/maxUnavailable=1,
  # so a rollout never creates a 3rd pod and never asks for a 3rd node.
  #
  # ACCEPTED TRADE-OFF (decided 2026-08-18): if spot capacity is unavailable,
  # this pool cannot grow to cover BOTH replicas — the second stays Pending
  # until spot returns, and Vendure serves on 1 replica.
  #
  # This is not theoretical. `aws ec2 get-spot-placement-scores` for c5a.large
  # returned 3/10 in ALL three ap-south-1 AZs on 2026-08-18 — low availability.
  # A t3a.medium spot node in the storefront pool was reclaimed the same day.
  # Expect the degraded window to happen.
  #
  # If running on 1 replica ever becomes unacceptable, raise this to 8Gi. That
  # restores the second on-demand node as a fallback, at the cost of permitting
  # 3 nodes in the tier during a spot outage.
  limits:
    cpu: 2
    memory: 4Gi

  # Disruption Settings
  disruption:
    # Consolidate when underutilized or empty
    consolidationPolicy: WhenEmptyOrUnderutilized
    # Wait 5 minutes before consolidating — prevents create/delete loop
    consolidateAfter: 5m

  # Priority weight (higher = preferred).
  # Lowered 100 -> 95 so `application-spot` (100, the Karpenter maximum) is
  # filled first and this pool only takes the overflow replica.
  weight: 95
