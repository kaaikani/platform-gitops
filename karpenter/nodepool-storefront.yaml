apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: storefront
spec:
  template:
    metadata:
      labels:
        node-type: on-demand
        workload: storefront
        cost-tier: budget
        node-group: storefront
    spec:
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]

        - key: kubernetes.io/os
          operator: In
          values: ["linux"]

        # Spot-preferred with automatic on-demand fallback (Karpenter
        # price-capacity-optimized). Storefronts run >=2 stateless replicas,
        # so a spot reclaim reschedules with no user-facing downtime.
        # ~60% cheaper than on-demand.
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["spot", "on-demand"]

        - key: karpenter.k8s.aws/instance-family
          operator: In
          values: ["t3a"]

        - key: karpenter.k8s.aws/instance-size
          operator: In
          values: ["medium"]

        - key: karpenter.k8s.aws/instance-generation
          operator: Gt
          values: ["2"]

        # Same AZ as the existing storefront node and RDS
        - key: topology.kubernetes.io/zone
          operator: In
          values: ["ap-south-1a"]

      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: default

      expireAfter: 720h

  # Capacity for 3 storefronts × 2 replicas + headroom for rollouts
  # Each t3a.medium = 2 vCPU / 4 GiB. Limit allows up to 3 nodes.
  limits:
    cpu: 6
    memory: 12Gi

  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 5m

  # Lower weight than 'application' (vendure) so vendure NodePool is preferred
  # for vendure pods; storefront pods will land here via node-group selector
  weight: 90
