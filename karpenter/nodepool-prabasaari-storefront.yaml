apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: prabasaari-storefront
spec:
  template:
    metadata:
      labels:
        node-type: on-demand
        workload: storefront
        cost-tier: low-traffic
        node-group: prabasaari-storefront
    spec:
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]

        - key: kubernetes.io/os
          operator: In
          values: ["linux"]

        # On-demand (NOT spot): prabasaari runs a single replica (HPA min=1),
        # so a spot reclaim would mean user-facing downtime. Matches the
        # vendure-clients pattern, not the multi-replica 'storefront' pool.
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"]

        # t3a.small: 2 vCPU / 2 GiB, burstable AMD — cheapest viable size for
        # the low-traffic prabasaari storefront. Burst credits are plentiful
        # at <1 RPS.
        - key: karpenter.k8s.aws/instance-family
          operator: In
          values: ["t3a"]

        - key: karpenter.k8s.aws/instance-size
          operator: In
          values: ["small"]

        - key: karpenter.k8s.aws/instance-generation
          operator: Gt
          values: ["2"]

        # Same AZ as RDS / vendure-client to avoid cross-AZ latency
        - key: topology.kubernetes.io/zone
          operator: In
          values: ["ap-south-1a"]

      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: default

      expireAfter: 720h

  # Dedicated to the prabasaari storefront only. Cap at 2 nodes — covers the
  # storefront's HPA (max=2, spread across hosts by podAntiAffinity) plus a
  # transient rolling-update surge. Each t3a.small = 2 vCPU / 2 GiB.
  limits:
    cpu: 4
    memory: 4Gi

  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 5m

  # Same low tier as 'vendure-clients' (80) so vendure-prod pods never land
  # here. Unique node-group label keeps this pool exclusive to prabasaari.
  weight: 80
