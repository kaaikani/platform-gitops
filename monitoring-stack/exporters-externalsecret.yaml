# =============================================================================
# Exporter credentials (monitoring namespace)
# =============================================================================
# Syncs DB + Redis credentials from AWS Secrets Manager into the monitoring
# namespace so the MySQL and Redis exporters can authenticate. Uses the same
# cluster-scoped ClusterSecretStore (aws-secrets-manager) and the same SM keys
# as vendure-secrets in vendure-production, so credentials never diverge.
#
# Produced secret: exporter-credentials  (keys: DB_PASSWORD, REDIS_HOST,
#   REDIS_PORT, REDIS_USERNAME, REDIS_PASSWORD)
# Deployed by the monitoring-dashboards ArgoCD app (monitoring-stack/*.yaml).
# =============================================================================
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: exporter-credentials
  namespace: monitoring
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: exporter-credentials
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: vendure/prod/database
    - extract:
        key: vendure/prod/redis
