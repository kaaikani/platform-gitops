        },
        {
          "id": 8,
          "title": "Error Budget Remaining",
          "type": "stat",
          "gridPos": { "h": 4, "w": 3, "x": 18, "y": 1 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            {
              "expr": "1 - ((1 - (sum(rate(http_requests_total{namespace=\"vendure-production\"}[30d])) - sum(rate(http_requests_total{namespace=\"vendure-production\",status=~\"5..\"}[30d]))) / sum(rate(http_requests_total{namespace=\"vendure-production\"}[30d]))) / (1 - 0.999))",
              "refId": "A"
