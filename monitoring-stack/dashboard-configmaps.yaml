apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-vendure-application
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: "Vendure"
data:
  vendure-application.json: |
    {
      "title": "Vendure Backend",
      "description": "RED Method + Node.js Runtime + Process Health + Failures",
      "uid": "vendure-application",
      "tags": ["vendure", "backend", "production"],
      "timezone": "Asia/Kolkata",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "time": { "from": "now-6h", "to": "now" },
      "editable": true,
      "graphTooltip": 1,
      "templating": {
        "list": [
          {
            "name": "datasource",
            "type": "datasource",
            "query": "prometheus",
            "current": { "text": "Prometheus", "value": "prometheus" },
            "hide": 0
          }
        ]
      },
      "panels": [
        { "collapsed": false, "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 }, "id": 100, "title": "RED Method Summary", "type": "row" },
        {
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "gridPos": { "h": 4, "w": 3, "x": 0, "y": 1 }, "id": 1,
          "title": "Requests/sec", "type": "stat",
          "fieldConfig": { "defaults": { "unit": "reqps", "color": { "mode": "thresholds" }, "thresholds": { "steps": [{ "color": "green", "value": null }] } } },
          "options": { "colorMode": "background", "graphMode": "area", "reduceOptions": { "calcs": ["lastNotNull"] } },
          "targets": [{ "expr": "sum(rate(http_requests_total{namespace=\"vendure-production\"}[5m]))", "refId": "A" }]
        },
        {
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "gridPos": { "h": 4, "w": 3, "x": 3, "y": 1 }, "id": 2,
          "title": "Error Rate", "type": "stat",
          "fieldConfig": { "defaults": { "unit": "percentunit", "color": { "mode": "thresholds" }, "thresholds": { "steps": [{ "color": "green", "value": null }, { "color": "red", "value": 0.01 }] }, "noValue": "0%" } },
          "options": { "colorMode": "background", "graphMode": "area", "reduceOptions": { "calcs": ["lastNotNull"] } },
          "targets": [{ "expr": "sum(rate(http_requests_total{namespace=\"vendure-production\",status=~\"5..\"}[5m])) / clamp_min(sum(rate(http_requests_total{namespace=\"vendure-production\"}[5m])), 0.001)", "refId": "A" }]
        },
        {
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "gridPos": { "h": 4, "w": 3, "x": 6, "y": 1 }, "id": 3,
          "title": "P95 Latency", "type": "stat",
          "fieldConfig": { "defaults": { "unit": "s", "color": { "mode": "thresholds" }, "thresholds": { "steps": [{ "color": "green", "value": null }, { "color": "yellow", "value": 0.5 }, { "color": "red", "value": 2 }] } } },
          "options": { "colorMode": "background", "graphMode": "area", "reduceOptions": { "calcs": ["lastNotNull"] } },
          "targets": [{ "expr": "histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket{namespace=\"vendure-production\"}[5m])) by (le))", "refId": "A" }]
        },
        {
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "gridPos": { "h": 4, "w": 3, "x": 9, "y": 1 }, "id": 4,
          "title": "P99 Latency", "type": "stat",
          "fieldConfig": { "defaults": { "unit": "s", "color": { "mode": "thresholds" }, "thresholds": { "steps": [{ "color": "green", "value": null }, { "color": "yellow", "value": 1 }, { "color": "red", "value": 5 }] } } },
          "options": { "colorMode": "background", "graphMode": "area", "reduceOptions": { "calcs": ["lastNotNull"] } },
          "targets": [{ "expr": "histogram_quantile(0.99, sum(rate(http_request_duration_seconds_bucket{namespace=\"vendure-production\"}[5m])) by (le))", "refId": "A" }]
        },
        {
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "gridPos": { "h": 4, "w": 3, "x": 12, "y": 1 }, "id": 5,
          "title": "Event Loop Lag", "type": "stat",
          "fieldConfig": { "defaults": { "unit": "s", "color": { "mode": "thresholds" }, "thresholds": { "steps": [{ "color": "green", "value": null }, { "color": "yellow", "value": 0.1 }, { "color": "red", "value": 0.5 }] } } },
          "options": { "colorMode": "background", "graphMode": "area", "reduceOptions": { "calcs": ["lastNotNull"] } },
          "targets": [{ "expr": "avg(vendure_nodejs_eventloop_lag_p99_seconds{namespace=\"vendure-production\"})", "refId": "A" }]
        },
        {
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "gridPos": { "h": 4, "w": 3, "x": 15, "y": 1 }, "id": 6,
          "title": "Heap Used %", "type": "gauge",
          "fieldConfig": { "defaults": { "unit": "percentunit", "min": 0, "max": 1, "thresholds": { "steps": [{ "color": "green", "value": null }, { "color": "yellow", "value": 0.7 }, { "color": "red", "value": 0.9 }] } } },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] } },
          "targets": [{ "expr": "avg(vendure_nodejs_heap_size_used_bytes{namespace=\"vendure-production\"} / vendure_nodejs_heap_size_total_bytes{namespace=\"vendure-production\"})", "refId": "A" }]
        },
        {
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "gridPos": { "h": 4, "w": 3, "x": 18, "y": 1 }, "id": 7,
          "title": "Open FDs", "type": "stat",
          "fieldConfig": { "defaults": { "color": { "mode": "thresholds" }, "thresholds": { "steps": [{ "color": "green", "value": null }, { "color": "yellow", "value": 500 }, { "color": "red", "value": 900 }] } } },
          "options": { "colorMode": "background", "graphMode": "area", "reduceOptions": { "calcs": ["lastNotNull"] } },
          "targets": [{ "expr": "avg(vendure_process_open_fds{namespace=\"vendure-production\"})", "refId": "A" }]
        },
        {
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "gridPos": { "h": 4, "w": 3, "x": 21, "y": 1 }, "id": 8,
          "title": "Running Pods", "type": "stat",
          "fieldConfig": { "defaults": { "color": { "mode": "thresholds" }, "thresholds": { "steps": [{ "color": "red", "value": null }, { "color": "yellow", "value": 1 }, { "color": "green", "value": 2 }] } } },
          "options": { "colorMode": "background", "graphMode": "none", "reduceOptions": { "calcs": ["lastNotNull"] } },
          "targets": [{ "expr": "count(kube_pod_status_phase{namespace=\"vendure-production\", phase=\"Running\"} == 1)", "refId": "A" }]
        },

        { "collapsed": false, "gridPos": { "h": 1, "w": 24, "x": 0, "y": 5 }, "id": 200, "title": "API Traffic — RED", "type": "row" },
        {
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 6 }, "id": 10,
          "title": "Request Rate by Route", "type": "timeseries",
          "fieldConfig": { "defaults": { "unit": "reqps", "color": { "mode": "palette-classic" }, "custom": { "fillOpacity": 20, "lineWidth": 2, "showPoints": "never", "stacking": { "mode": "normal" } } } },
          "options": { "legend": { "calcs": ["mean", "max", "lastNotNull"], "displayMode": "table", "placement": "bottom" }, "tooltip": { "mode": "multi" } },
          "targets": [{ "expr": "sum(rate(http_requests_total{namespace=\"vendure-production\"}[5m])) by (route)", "legendFormat": "{{route}}", "refId": "A" }]
        },
        {
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 6 }, "id": 11,
          "title": "HTTP Status Codes", "type": "timeseries",
          "fieldConfig": {
            "defaults": { "unit": "reqps", "color": { "mode": "palette-classic" }, "custom": { "fillOpacity": 30, "lineWidth": 2, "showPoints": "never", "stacking": { "mode": "normal" } } },
            "overrides": [
              { "matcher": { "id": "byRegexp", "options": "2.." }, "properties": [{ "id": "color", "value": { "fixedColor": "green", "mode": "fixed" } }] },
              { "matcher": { "id": "byRegexp", "options": "4.." }, "properties": [{ "id": "color", "value": { "fixedColor": "yellow", "mode": "fixed" } }] },
              { "matcher": { "id": "byRegexp", "options": "5.." }, "properties": [{ "id": "color", "value": { "fixedColor": "red", "mode": "fixed" } }] }
            ]
          },
          "options": { "legend": { "calcs": ["mean", "max"], "displayMode": "table", "placement": "bottom" }, "tooltip": { "mode": "multi" } },
          "targets": [{ "expr": "sum(rate(http_requests_total{namespace=\"vendure-production\"}[5m])) by (status)", "legendFormat": "{{status}}", "refId": "A" }]
        },

        { "collapsed": false, "gridPos": { "h": 1, "w": 24, "x": 0, "y": 14 }, "id": 300, "title": "Latency", "type": "row" },
        {
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 15 }, "id": 20,
          "title": "Latency Percentiles", "type": "timeseries",
          "fieldConfig": { "defaults": { "unit": "s", "color": { "mode": "palette-classic" }, "custom": { "fillOpacity": 10, "lineWidth": 2, "showPoints": "never" } } },
          "options": { "legend": { "calcs": ["mean", "max"], "displayMode": "table", "placement": "bottom" }, "tooltip": { "mode": "multi" } },
          "targets": [
            { "expr": "histogram_quantile(0.50, sum(rate(http_request_duration_seconds_bucket{namespace=\"vendure-production\"}[5m])) by (le))", "legendFormat": "p50", "refId": "A" },
            { "expr": "histogram_quantile(0.90, sum(rate(http_request_duration_seconds_bucket{namespace=\"vendure-production\"}[5m])) by (le))", "legendFormat": "p90", "refId": "B" },
            { "expr": "histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket{namespace=\"vendure-production\"}[5m])) by (le))", "legendFormat": "p95", "refId": "C" },
            { "expr": "histogram_quantile(0.99, sum(rate(http_request_duration_seconds_bucket{namespace=\"vendure-production\"}[5m])) by (le))", "legendFormat": "p99", "refId": "D" }
          ]
        },
        {
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 15 }, "id": 21,
          "title": "P95 Latency by Route", "type": "timeseries",
          "fieldConfig": { "defaults": { "unit": "s", "color": { "mode": "palette-classic" }, "custom": { "fillOpacity": 10, "lineWidth": 2, "showPoints": "never" } } },
          "options": { "legend": { "calcs": ["mean", "max"], "displayMode": "table", "placement": "bottom" }, "tooltip": { "mode": "multi" } },
          "targets": [{ "expr": "histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket{namespace=\"vendure-production\"}[5m])) by (le, route))", "legendFormat": "{{route}}", "refId": "A" }]
        },

        { "collapsed": false, "gridPos": { "h": 1, "w": 24, "x": 0, "y": 23 }, "id": 400, "title": "Node.js Runtime", "type": "row" },
        {
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 24 }, "id": 30,
          "title": "Event Loop Lag", "type": "timeseries",
          "fieldConfig": { "defaults": { "unit": "s", "color": { "mode": "palette-classic" }, "custom": { "fillOpacity": 10, "lineWidth": 2, "showPoints": "never" } } },
          "options": { "legend": { "calcs": ["mean", "max"], "displayMode": "table", "placement": "bottom" }, "tooltip": { "mode": "multi" } },
          "targets": [
            { "expr": "vendure_nodejs_eventloop_lag_p50_seconds{namespace=\"vendure-production\"}", "legendFormat": "{{pod}} p50", "refId": "A" },
            { "expr": "vendure_nodejs_eventloop_lag_p99_seconds{namespace=\"vendure-production\"}", "legendFormat": "{{pod}} p99", "refId": "B" }
          ]
        },
        {
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 24 }, "id": 31,
          "title": "Heap Memory", "type": "timeseries",
          "fieldConfig": { "defaults": { "unit": "bytes", "color": { "mode": "palette-classic" }, "custom": { "fillOpacity": 20, "lineWidth": 2, "showPoints": "never" } } },
          "options": { "legend": { "calcs": ["mean", "max", "lastNotNull"], "displayMode": "table", "placement": "bottom" }, "tooltip": { "mode": "multi" } },
          "targets": [
            { "expr": "vendure_nodejs_heap_size_used_bytes{namespace=\"vendure-production\"}", "legendFormat": "{{pod}} used", "refId": "A" },
            { "expr": "vendure_nodejs_heap_size_total_bytes{namespace=\"vendure-production\"}", "legendFormat": "{{pod}} total", "refId": "B" }
          ]
        },
        {
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 32 }, "id": 32,
          "title": "Active Connections & Handles", "type": "timeseries",
          "fieldConfig": { "defaults": { "color": { "mode": "palette-classic" }, "custom": { "fillOpacity": 10, "lineWidth": 2, "showPoints": "never" } } },
          "options": { "legend": { "calcs": ["mean", "max", "lastNotNull"], "displayMode": "table", "placement": "bottom" }, "tooltip": { "mode": "multi" } },
          "targets": [
            { "expr": "vendure_nodejs_active_resources{namespace=\"vendure-production\",type=\"TCPSocketWrap\"}", "legendFormat": "{{pod}} TCP", "refId": "A" },
            { "expr": "vendure_nodejs_active_resources_total{namespace=\"vendure-production\"}", "legendFormat": "{{pod}} total handles", "refId": "B" }
          ]
        },

        { "collapsed": false, "gridPos": { "h": 1, "w": 24, "x": 0, "y": 40 }, "id": 500, "title": "Process Health", "type": "row" },
        {
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "gridPos": { "h": 8, "w": 8, "x": 0, "y": 41 }, "id": 40,
          "title": "Process CPU", "type": "timeseries",
          "fieldConfig": { "defaults": { "color": { "mode": "palette-classic" }, "custom": { "fillOpacity": 20, "lineWidth": 2, "showPoints": "never" } } },
          "options": { "legend": { "calcs": ["mean", "max"], "displayMode": "table", "placement": "bottom" }, "tooltip": { "mode": "multi" } },
          "targets": [{ "expr": "rate(vendure_process_cpu_seconds_total{namespace=\"vendure-production\"}[5m])", "legendFormat": "{{pod}}", "refId": "A" }]
        },
        {
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "gridPos": { "h": 8, "w": 8, "x": 8, "y": 41 }, "id": 41,
          "title": "Process RSS Memory", "type": "timeseries",
          "fieldConfig": { "defaults": { "unit": "bytes", "color": { "mode": "palette-classic" }, "custom": { "fillOpacity": 20, "lineWidth": 2, "showPoints": "never" } } },
          "options": { "legend": { "calcs": ["mean", "max", "lastNotNull"], "displayMode": "table", "placement": "bottom" }, "tooltip": { "mode": "multi" } },
          "targets": [{ "expr": "vendure_process_resident_memory_bytes{namespace=\"vendure-production\"}", "legendFormat": "{{pod}}", "refId": "A" }]
        },
        {
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "gridPos": { "h": 8, "w": 8, "x": 16, "y": 41 }, "id": 42,
          "title": "Open File Descriptors", "type": "timeseries",
          "fieldConfig": { "defaults": { "color": { "mode": "palette-classic" }, "custom": { "fillOpacity": 10, "lineWidth": 2, "showPoints": "never" } } },
          "options": { "legend": { "calcs": ["mean", "max", "lastNotNull"], "displayMode": "table", "placement": "bottom" }, "tooltip": { "mode": "multi" } },
          "targets": [{ "expr": "vendure_process_open_fds{namespace=\"vendure-production\"}", "legendFormat": "{{pod}}", "refId": "A" }]
        },

        { "collapsed": false, "gridPos": { "h": 1, "w": 24, "x": 0, "y": 49 }, "id": 600, "title": "Failures", "type": "row" },
        {
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 50 }, "id": 50,
          "title": "Pod Restarts", "type": "timeseries",
          "fieldConfig": { "defaults": { "color": { "mode": "palette-classic" }, "custom": { "fillOpacity": 30, "lineWidth": 2, "showPoints": "always", "drawStyle": "bars" }, "decimals": 0 } },
          "options": { "legend": { "calcs": ["sum"], "displayMode": "table", "placement": "bottom" }, "tooltip": { "mode": "multi" } },
          "targets": [{ "expr": "increase(kube_pod_container_status_restarts_total{namespace=\"vendure-production\"}[1h])", "legendFormat": "{{pod}} ({{container}})", "refId": "A" }]
        },
        {
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 50 }, "id": 51,
          "title": "CrashLoop & OOMKill Events", "type": "timeseries",
          "fieldConfig": { "defaults": { "color": { "mode": "palette-classic" }, "custom": { "fillOpacity": 20, "lineWidth": 2, "showPoints": "never", "stacking": { "mode": "normal" } }, "decimals": 0 } },
          "options": { "legend": { "calcs": ["lastNotNull", "sum"], "displayMode": "table", "placement": "bottom" }, "tooltip": { "mode": "multi" } },
          "targets": [
            { "expr": "sum(increase(kube_pod_container_status_restarts_total{namespace=\"vendure-production\",container=~\"vendure|vendure-worker\"}[15m])) by (pod)", "legendFormat": "Restarts/15m: {{pod}}", "refId": "A" },
            { "expr": "sum(kube_pod_container_status_last_terminated_reason{namespace=\"vendure-production\",reason=\"OOMKilled\"}) by (pod)", "legendFormat": "OOMKilled: {{pod}}", "refId": "B" }
          ]
        }
      ]
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-storefronts-overview
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: "Storefronts"
data:
  storefronts-overview.json: |
    {
      "title": "Storefronts",
      "description": "Frontend health per storefront — errors, CPU, memory, network, scaling",
      "uid": "storefronts-overview",
      "tags": ["storefront", "frontend", "production"],
      "timezone": "Asia/Kolkata",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "time": { "from": "now-6h", "to": "now" },
      "editable": true,
      "graphTooltip": 1,
      "templating": {
        "list": [
          { "name": "datasource", "type": "datasource", "query": "prometheus", "current": { "text": "Prometheus", "value": "prometheus" }, "hide": 0 },
          {
            "name": "namespace", "type": "custom", "hide": 0, "includeAll": false, "multi": false,
            "options": [
              { "selected": true, "text": "storefront-production", "value": "storefront-production" },
              { "selected": false, "text": "southmithai-production", "value": "southmithai-production" },
              { "selected": false, "text": "swadkerala-production", "value": "swadkerala-production" }
            ],
            "query": "storefront-production,southmithai-production,swadkerala-production"
          }
        ]
      },
      "panels": [
        { "collapsed": false, "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 }, "id": 100, "title": "Health — $namespace", "type": "row" },
        { "datasource": { "type": "prometheus", "uid": "${datasource}" }, "gridPos": { "h": 4, "w": 3, "x": 0, "y": 1 }, "id": 1, "title": "Running Pods", "type": "stat", "fieldConfig": { "defaults": { "color": { "mode": "thresholds" }, "thresholds": { "steps": [{ "color": "red", "value": null }, { "color": "yellow", "value": 1 }, { "color": "green", "value": 2 }] } } }, "options": { "colorMode": "background", "graphMode": "none", "reduceOptions": { "calcs": ["lastNotNull"] } }, "targets": [{ "expr": "count(kube_pod_status_phase{namespace=\"$namespace\", phase=\"Running\"} == 1)", "refId": "A" }] },
        { "datasource": { "type": "prometheus", "uid": "${datasource}" }, "gridPos": { "h": 4, "w": 3, "x": 3, "y": 1 }, "id": 2, "title": "Ready Pods", "type": "stat", "fieldConfig": { "defaults": { "color": { "mode": "thresholds" }, "thresholds": { "steps": [{ "color": "red", "value": null }, { "color": "green", "value": 1 }] } } }, "options": { "colorMode": "background", "graphMode": "none", "reduceOptions": { "calcs": ["lastNotNull"] } }, "targets": [{ "expr": "sum(kube_pod_status_ready{namespace=\"$namespace\",condition=\"true\"})", "refId": "A" }] },
        { "datasource": { "type": "prometheus", "uid": "${datasource}" }, "gridPos": { "h": 4, "w": 3, "x": 6, "y": 1 }, "id": 3, "title": "Restarts (24h)", "type": "stat", "fieldConfig": { "defaults": { "color": { "mode": "thresholds" }, "decimals": 0, "thresholds": { "steps": [{ "color": "green", "value": null }, { "color": "yellow", "value": 1 }, { "color": "red", "value": 5 }] } } }, "options": { "colorMode": "background", "graphMode": "area", "reduceOptions": { "calcs": ["lastNotNull"] } }, "targets": [{ "expr": "sum(increase(kube_pod_container_status_restarts_total{namespace=\"$namespace\"}[24h]))", "refId": "A" }] },
        { "datasource": { "type": "prometheus", "uid": "${datasource}" }, "gridPos": { "h": 4, "w": 3, "x": 9, "y": 1 }, "id": 4, "title": "CPU Usage", "type": "gauge", "fieldConfig": { "defaults": { "unit": "percentunit", "min": 0, "max": 1, "thresholds": { "steps": [{ "color": "green", "value": null }, { "color": "yellow", "value": 0.7 }, { "color": "red", "value": 0.9 }] } } }, "options": { "reduceOptions": { "calcs": ["lastNotNull"] } }, "targets": [{ "expr": "sum(rate(container_cpu_usage_seconds_total{namespace=\"$namespace\",container!=\"\",container!=\"POD\"}[5m])) / sum(kube_pod_container_resource_limits{namespace=\"$namespace\",resource=\"cpu\"})", "refId": "A" }] },
        { "datasource": { "type": "prometheus", "uid": "${datasource}" }, "gridPos": { "h": 4, "w": 3, "x": 12, "y": 1 }, "id": 5, "title": "Memory Usage", "type": "gauge", "fieldConfig": { "defaults": { "unit": "percentunit", "min": 0, "max": 1, "thresholds": { "steps": [{ "color": "green", "value": null }, { "color": "yellow", "value": 0.7 }, { "color": "red", "value": 0.9 }] } } }, "options": { "reduceOptions": { "calcs": ["lastNotNull"] } }, "targets": [{ "expr": "sum(container_memory_working_set_bytes{namespace=\"$namespace\",container!=\"\",container!=\"POD\"}) / sum(kube_pod_container_resource_limits{namespace=\"$namespace\",resource=\"memory\"})", "refId": "A" }] },
        { "datasource": { "type": "prometheus", "uid": "${datasource}" }, "gridPos": { "h": 4, "w": 3, "x": 15, "y": 1 }, "id": 6, "title": "Network In", "type": "stat", "fieldConfig": { "defaults": { "unit": "Bps", "color": { "mode": "thresholds" }, "thresholds": { "steps": [{ "color": "green", "value": null }] } } }, "options": { "colorMode": "none", "graphMode": "area", "reduceOptions": { "calcs": ["lastNotNull"] } }, "targets": [{ "expr": "sum(rate(container_network_receive_bytes_total{namespace=\"$namespace\"}[5m]))", "refId": "A" }] },
        { "datasource": { "type": "prometheus", "uid": "${datasource}" }, "gridPos": { "h": 4, "w": 3, "x": 18, "y": 1 }, "id": 7, "title": "Network Out", "type": "stat", "fieldConfig": { "defaults": { "unit": "Bps", "color": { "mode": "thresholds" }, "thresholds": { "steps": [{ "color": "green", "value": null }] } } }, "options": { "colorMode": "none", "graphMode": "area", "reduceOptions": { "calcs": ["lastNotNull"] } }, "targets": [{ "expr": "sum(rate(container_network_transmit_bytes_total{namespace=\"$namespace\"}[5m]))", "refId": "A" }] },
        { "datasource": { "type": "prometheus", "uid": "${datasource}" }, "gridPos": { "h": 4, "w": 3, "x": 21, "y": 1 }, "id": 8, "title": "HPA Replicas", "type": "stat", "fieldConfig": { "defaults": { "color": { "mode": "thresholds" }, "thresholds": { "steps": [{ "color": "green", "value": null }] }, "decimals": 0 } }, "options": { "colorMode": "background", "graphMode": "area", "reduceOptions": { "calcs": ["lastNotNull"] } }, "targets": [{ "expr": "sum(kube_horizontalpodautoscaler_status_current_replicas{namespace=\"$namespace\"})", "refId": "A" }] },
        { "collapsed": false, "gridPos": { "h": 1, "w": 24, "x": 0, "y": 5 }, "id": 200, "title": "Errors & Failures", "type": "row" },
        { "datasource": { "type": "prometheus", "uid": "${datasource}" }, "gridPos": { "h": 8, "w": 12, "x": 0, "y": 6 }, "id": 10, "title": "Pod Restarts", "type": "timeseries", "fieldConfig": { "defaults": { "color": { "mode": "palette-classic" }, "custom": { "fillOpacity": 30, "lineWidth": 2, "showPoints": "always", "drawStyle": "bars" }, "decimals": 0 } }, "options": { "legend": { "calcs": ["sum"], "displayMode": "table", "placement": "bottom" }, "tooltip": { "mode": "multi" } }, "targets": [{ "expr": "increase(kube_pod_container_status_restarts_total{namespace=\"$namespace\"}[1h])", "legendFormat": "{{pod}}", "refId": "A" }] },
        { "datasource": { "type": "prometheus", "uid": "${datasource}" }, "gridPos": { "h": 8, "w": 12, "x": 12, "y": 6 }, "id": 11, "title": "Container Error States", "type": "timeseries", "fieldConfig": { "defaults": { "color": { "mode": "palette-classic" }, "custom": { "fillOpacity": 20, "lineWidth": 2, "showPoints": "never", "stacking": { "mode": "normal" } }, "decimals": 0 } }, "options": { "legend": { "calcs": ["lastNotNull", "sum"], "displayMode": "table", "placement": "bottom" }, "tooltip": { "mode": "multi" } }, "targets": [{ "expr": "sum(increase(kube_pod_container_status_restarts_total{namespace=\"$namespace\"}[$__range])) by (pod)", "legendFormat": "Restarts: {{pod}}", "refId": "A" }, { "expr": "sum(kube_pod_container_status_last_terminated_reason{namespace=\"$namespace\"}) by (reason)", "legendFormat": "Terminated: {{reason}}", "refId": "B" }] },
        { "collapsed": false, "gridPos": { "h": 1, "w": 24, "x": 0, "y": 14 }, "id": 300, "title": "CPU & Memory", "type": "row" },
        { "datasource": { "type": "prometheus", "uid": "${datasource}" }, "gridPos": { "h": 8, "w": 12, "x": 0, "y": 15 }, "id": 20, "title": "CPU per Pod (millicores)", "type": "timeseries", "fieldConfig": { "defaults": { "unit": "short", "color": { "mode": "palette-classic" }, "custom": { "fillOpacity": 20, "lineWidth": 2, "showPoints": "never" } }, "overrides": [{ "matcher": { "id": "byRegexp", "options": ".*limit" }, "properties": [{ "id": "custom.lineStyle", "value": { "dash": [10, 10], "fill": "dash" } }, { "id": "custom.fillOpacity", "value": 0 }, { "id": "color", "value": { "fixedColor": "red", "mode": "fixed" } }] }] }, "options": { "legend": { "calcs": ["mean", "max", "lastNotNull"], "displayMode": "table", "placement": "bottom" }, "tooltip": { "mode": "multi" } }, "targets": [{ "expr": "rate(container_cpu_usage_seconds_total{namespace=\"$namespace\",container!=\"\",container!=\"POD\"}[5m]) * 1000", "legendFormat": "{{pod}} ({{container}})", "refId": "A" }, { "expr": "kube_pod_container_resource_limits{namespace=\"$namespace\",resource=\"cpu\"} * 1000", "legendFormat": "{{pod}} limit", "refId": "B" }] },
        { "datasource": { "type": "prometheus", "uid": "${datasource}" }, "gridPos": { "h": 8, "w": 12, "x": 12, "y": 15 }, "id": 21, "title": "Memory per Pod", "type": "timeseries", "fieldConfig": { "defaults": { "unit": "bytes", "color": { "mode": "palette-classic" }, "custom": { "fillOpacity": 20, "lineWidth": 2, "showPoints": "never" } }, "overrides": [{ "matcher": { "id": "byRegexp", "options": ".*limit" }, "properties": [{ "id": "custom.lineStyle", "value": { "dash": [10, 10], "fill": "dash" } }, { "id": "custom.fillOpacity", "value": 0 }, { "id": "color", "value": { "fixedColor": "red", "mode": "fixed" } }] }] }, "options": { "legend": { "calcs": ["mean", "max", "lastNotNull"], "displayMode": "table", "placement": "bottom" }, "tooltip": { "mode": "multi" } }, "targets": [{ "expr": "container_memory_working_set_bytes{namespace=\"$namespace\",container!=\"\",container!=\"POD\"}", "legendFormat": "{{pod}} ({{container}})", "refId": "A" }, { "expr": "kube_pod_container_resource_limits{namespace=\"$namespace\",resource=\"memory\"}", "legendFormat": "{{pod}} limit", "refId": "B" }] },
        { "collapsed": false, "gridPos": { "h": 1, "w": 24, "x": 0, "y": 23 }, "id": 400, "title": "Network", "type": "row" },
        { "datasource": { "type": "prometheus", "uid": "${datasource}" }, "gridPos": { "h": 8, "w": 12, "x": 0, "y": 24 }, "id": 30, "title": "Network Bandwidth per Pod", "type": "timeseries", "fieldConfig": { "defaults": { "unit": "Bps", "color": { "mode": "palette-classic" }, "custom": { "fillOpacity": 20, "lineWidth": 2, "showPoints": "never" } } }, "options": { "legend": { "calcs": ["mean", "max"], "displayMode": "table", "placement": "bottom" }, "tooltip": { "mode": "multi" } }, "targets": [{ "expr": "sum(rate(container_network_receive_bytes_total{namespace=\"$namespace\"}[5m])) by (pod)", "legendFormat": "{{pod}} rx", "refId": "A" }, { "expr": "-sum(rate(container_network_transmit_bytes_total{namespace=\"$namespace\"}[5m])) by (pod)", "legendFormat": "{{pod}} tx", "refId": "B" }] },
        { "datasource": { "type": "prometheus", "uid": "${datasource}" }, "gridPos": { "h": 8, "w": 12, "x": 12, "y": 24 }, "id": 31, "title": "Network Errors & Drops", "type": "timeseries", "fieldConfig": { "defaults": { "unit": "pps", "color": { "mode": "palette-classic" }, "custom": { "fillOpacity": 20, "lineWidth": 2, "showPoints": "never" } } }, "options": { "legend": { "calcs": ["sum"], "displayMode": "table", "placement": "bottom" }, "tooltip": { "mode": "multi" } }, "targets": [{ "expr": "rate(container_network_receive_errors_total{namespace=\"$namespace\"}[5m])", "legendFormat": "{{pod}} rx errors", "refId": "A" }, { "expr": "rate(container_network_transmit_errors_total{namespace=\"$namespace\"}[5m])", "legendFormat": "{{pod}} tx errors", "refId": "B" }, { "expr": "rate(container_network_receive_packets_dropped_total{namespace=\"$namespace\"}[5m])", "legendFormat": "{{pod}} rx drops", "refId": "C" }] },
        { "collapsed": false, "gridPos": { "h": 1, "w": 24, "x": 0, "y": 32 }, "id": 500, "title": "Scaling", "type": "row" },
        { "datasource": { "type": "prometheus", "uid": "${datasource}" }, "gridPos": { "h": 8, "w": 12, "x": 0, "y": 33 }, "id": 40, "title": "HPA Current vs Desired", "type": "timeseries", "fieldConfig": { "defaults": { "color": { "mode": "palette-classic" }, "custom": { "fillOpacity": 0, "lineWidth": 2, "showPoints": "never" }, "decimals": 0 }, "overrides": [{ "matcher": { "id": "byRegexp", "options": ".*min|.*max" }, "properties": [{ "id": "custom.lineStyle", "value": { "dash": [5, 5], "fill": "dash" } }] }] }, "options": { "legend": { "calcs": ["lastNotNull"], "displayMode": "table", "placement": "bottom" }, "tooltip": { "mode": "multi" } }, "targets": [{ "expr": "kube_horizontalpodautoscaler_status_current_replicas{namespace=\"$namespace\"}", "legendFormat": "current", "refId": "A" }, { "expr": "kube_horizontalpodautoscaler_status_desired_replicas{namespace=\"$namespace\"}", "legendFormat": "desired", "refId": "B" }, { "expr": "kube_horizontalpodautoscaler_spec_min_replicas{namespace=\"$namespace\"}", "legendFormat": "min", "refId": "C" }, { "expr": "kube_horizontalpodautoscaler_spec_max_replicas{namespace=\"$namespace\"}", "legendFormat": "max", "refId": "D" }] },
        { "datasource": { "type": "prometheus", "uid": "${datasource}" }, "gridPos": { "h": 8, "w": 12, "x": 12, "y": 33 }, "id": 41, "title": "CPU Throttling %", "type": "timeseries", "fieldConfig": { "defaults": { "unit": "percent", "color": { "mode": "palette-classic" }, "custom": { "fillOpacity": 20, "lineWidth": 2, "showPoints": "never" }, "min": 0, "max": 100 } }, "options": { "legend": { "calcs": ["mean", "max"], "displayMode": "table", "placement": "bottom" }, "tooltip": { "mode": "multi" } }, "targets": [{ "expr": "sum(increase(container_cpu_cfs_throttled_periods_total{namespace=\"$namespace\",container!=\"\",container!=\"POD\"}[5m])) by (pod) / sum(increase(container_cpu_cfs_periods_total{namespace=\"$namespace\",container!=\"\",container!=\"POD\"}[5m])) by (pod) * 100", "legendFormat": "{{pod}}", "refId": "A" }] }
      ]
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-k8s-cluster-overview
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: "Kubernetes"
data:
  cluster-overview.json: |
    {
      "title": "Kubernetes Cluster",
      "description": "EKS infrastructure — nodes, pods, resource pressure, HPA, throttling",
      "uid": "k8s-cluster-overview",
      "tags": ["kubernetes", "eks", "infrastructure"],
      "timezone": "Asia/Kolkata",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "time": { "from": "now-6h", "to": "now" },
      "editable": true,
      "graphTooltip": 1,
      "templating": {
        "list": [
          { "name": "datasource", "type": "datasource", "query": "prometheus", "current": { "text": "Prometheus", "value": "prometheus" }, "hide": 0 }
        ]
      },
      "panels": [
        { "collapsed": false, "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 }, "id": 100, "title": "Cluster Summary", "type": "row" },
        {
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "gridPos": { "h": 4, "w": 3, "x": 0, "y": 1 }, "id": 1,
          "title": "Total Nodes", "type": "stat",
          "fieldConfig": { "defaults": { "color": { "mode": "thresholds" }, "thresholds": { "steps": [{ "color": "green", "value": null }] } } },
          "options": { "colorMode": "background", "graphMode": "none", "reduceOptions": { "calcs": ["lastNotNull"] } },
          "targets": [{ "expr": "count(kube_node_info)", "refId": "A" }]
        },
        {
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "gridPos": { "h": 4, "w": 3, "x": 3, "y": 1 }, "id": 2,
          "title": "Ready Nodes", "type": "stat",
          "fieldConfig": { "defaults": { "color": { "mode": "thresholds" }, "thresholds": { "steps": [{ "color": "green", "value": null }] } } },
          "options": { "colorMode": "background", "graphMode": "none", "reduceOptions": { "calcs": ["lastNotNull"] } },
          "targets": [{ "expr": "sum(kube_node_status_condition{condition=\"Ready\",status=\"true\"})", "refId": "A" }]
        },
        {
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "gridPos": { "h": 4, "w": 3, "x": 6, "y": 1 }, "id": 3,
          "title": "Pending Pods", "type": "stat",
          "fieldConfig": { "defaults": { "color": { "mode": "thresholds" }, "thresholds": { "steps": [{ "color": "green", "value": null }, { "color": "yellow", "value": 1 }, { "color": "red", "value": 5 }] }, "noValue": "0" } },
          "options": { "colorMode": "background", "graphMode": "area", "reduceOptions": { "calcs": ["lastNotNull"] } },
          "targets": [{ "expr": "sum(kube_pod_status_phase{phase=\"Pending\"}) or vector(0)", "refId": "A" }]
        },
        {
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "gridPos": { "h": 4, "w": 3, "x": 9, "y": 1 }, "id": 4,
          "title": "Failed Pods", "type": "stat",
          "fieldConfig": { "defaults": { "color": { "mode": "thresholds" }, "thresholds": { "steps": [{ "color": "green", "value": null }, { "color": "red", "value": 1 }] }, "noValue": "0" } },
          "options": { "colorMode": "background", "graphMode": "area", "reduceOptions": { "calcs": ["lastNotNull"] } },
          "targets": [{ "expr": "sum(kube_pod_status_phase{phase=\"Failed\"}) or vector(0)", "refId": "A" }]
        },
        {
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "gridPos": { "h": 4, "w": 3, "x": 12, "y": 1 }, "id": 5,
          "title": "Total Pods", "type": "stat",
          "fieldConfig": { "defaults": { "color": { "mode": "thresholds" }, "thresholds": { "steps": [{ "color": "green", "value": null }] } } },
          "options": { "colorMode": "background", "graphMode": "area", "reduceOptions": { "calcs": ["lastNotNull"] } },
          "targets": [{ "expr": "count(kube_pod_info)", "refId": "A" }]
        },
        {
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "gridPos": { "h": 4, "w": 3, "x": 15, "y": 1 }, "id": 6,
          "title": "Cluster CPU", "type": "gauge",
          "fieldConfig": { "defaults": { "unit": "percentunit", "min": 0, "max": 1, "thresholds": { "steps": [{ "color": "green", "value": null }, { "color": "yellow", "value": 0.7 }, { "color": "red", "value": 0.9 }] } } },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] } },
          "targets": [{ "expr": "1 - avg(rate(node_cpu_seconds_total{mode=\"idle\"}[5m]))", "refId": "A" }]
        },
        {
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "gridPos": { "h": 4, "w": 3, "x": 18, "y": 1 }, "id": 7,
          "title": "Cluster RAM", "type": "gauge",
          "fieldConfig": { "defaults": { "unit": "percentunit", "min": 0, "max": 1, "thresholds": { "steps": [{ "color": "green", "value": null }, { "color": "yellow", "value": 0.7 }, { "color": "red", "value": 0.9 }] } } },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] } },
          "targets": [{ "expr": "1 - sum(node_memory_MemAvailable_bytes) / sum(node_memory_MemTotal_bytes)", "refId": "A" }]
        },
        {
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "gridPos": { "h": 4, "w": 3, "x": 21, "y": 1 }, "id": 8,
          "title": "Cluster Disk", "type": "gauge",
          "fieldConfig": { "defaults": { "unit": "percentunit", "min": 0, "max": 1, "thresholds": { "steps": [{ "color": "green", "value": null }, { "color": "yellow", "value": 0.7 }, { "color": "red", "value": 0.85 }] } } },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] } },
          "targets": [{ "expr": "1 - sum(node_filesystem_avail_bytes{mountpoint=\"/\",fstype!=\"rootfs\"}) / sum(node_filesystem_size_bytes{mountpoint=\"/\",fstype!=\"rootfs\"})", "refId": "A" }]
        },

        { "collapsed": false, "gridPos": { "h": 1, "w": 24, "x": 0, "y": 5 }, "id": 200, "title": "Node Metrics", "type": "row" },
        {
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 6 }, "id": 10,
          "title": "CPU Usage per Node", "type": "timeseries",
          "fieldConfig": { "defaults": { "unit": "percentunit", "color": { "mode": "palette-classic" }, "custom": { "fillOpacity": 20, "lineWidth": 2, "showPoints": "never" } } },
          "options": { "legend": { "calcs": ["mean", "max", "lastNotNull"], "displayMode": "table", "placement": "bottom" }, "tooltip": { "mode": "multi" } },
          "targets": [{ "expr": "1 - avg(rate(node_cpu_seconds_total{mode=\"idle\"}[5m])) by (instance)", "legendFormat": "{{instance}}", "refId": "A" }]
        },
        {
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 6 }, "id": 11,
          "title": "Memory Available per Node", "type": "timeseries",
          "fieldConfig": { "defaults": { "unit": "bytes", "color": { "mode": "palette-classic" }, "custom": { "fillOpacity": 20, "lineWidth": 2, "showPoints": "never" } } },
          "options": { "legend": { "calcs": ["mean", "lastNotNull"], "displayMode": "table", "placement": "bottom" }, "tooltip": { "mode": "multi" } },
          "targets": [{ "expr": "node_memory_MemAvailable_bytes", "legendFormat": "{{instance}}", "refId": "A" }]
        },

        { "collapsed": false, "gridPos": { "h": 1, "w": 24, "x": 0, "y": 14 }, "id": 300, "title": "Disk & Load", "type": "row" },
        {
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 15 }, "id": 20,
          "title": "Disk Available per Node", "type": "timeseries",
          "fieldConfig": { "defaults": { "unit": "bytes", "color": { "mode": "palette-classic" }, "custom": { "fillOpacity": 20, "lineWidth": 2, "showPoints": "never" } } },
          "options": { "legend": { "calcs": ["lastNotNull"], "displayMode": "table", "placement": "bottom" }, "tooltip": { "mode": "multi" } },
          "targets": [{ "expr": "node_filesystem_avail_bytes{mountpoint=\"/\",fstype!=\"rootfs\"}", "legendFormat": "{{instance}}", "refId": "A" }]
        },
        {
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 15 }, "id": 21,
          "title": "System Load (1m avg)", "type": "timeseries",
          "fieldConfig": { "defaults": { "color": { "mode": "palette-classic" }, "custom": { "fillOpacity": 10, "lineWidth": 2, "showPoints": "never" } } },
          "options": { "legend": { "calcs": ["mean", "max"], "displayMode": "table", "placement": "bottom" }, "tooltip": { "mode": "multi" } },
          "targets": [{ "expr": "node_load1", "legendFormat": "{{instance}}", "refId": "A" }]
        },

        { "collapsed": false, "gridPos": { "h": 1, "w": 24, "x": 0, "y": 23 }, "id": 400, "title": "Pod Metrics", "type": "row" },
        {
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 24 }, "id": 30,
          "title": "Pod Restarts (All Namespaces)", "type": "timeseries",
          "fieldConfig": { "defaults": { "color": { "mode": "palette-classic" }, "custom": { "fillOpacity": 30, "lineWidth": 2, "showPoints": "always", "drawStyle": "bars" }, "decimals": 0 } },
          "options": { "legend": { "calcs": ["sum"], "displayMode": "table", "placement": "bottom" }, "tooltip": { "mode": "multi" } },
          "targets": [{ "expr": "topk(10, increase(kube_pod_container_status_restarts_total[1h]))", "legendFormat": "{{namespace}}/{{pod}}", "refId": "A" }]
        },
        {
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 24 }, "id": 31,
          "title": "Pods by Phase", "type": "timeseries",
          "fieldConfig": { "defaults": { "color": { "mode": "palette-classic" }, "custom": { "fillOpacity": 20, "lineWidth": 2, "showPoints": "never", "stacking": { "mode": "normal" } } } },
          "options": { "legend": { "calcs": ["lastNotNull"], "displayMode": "table", "placement": "bottom" }, "tooltip": { "mode": "multi" } },
          "targets": [{ "expr": "count(kube_pod_status_phase == 1) by (phase)", "legendFormat": "{{phase}}", "refId": "A" }]
        },

        { "collapsed": false, "gridPos": { "h": 1, "w": 24, "x": 0, "y": 32 }, "id": 500, "title": "Resource Pressure", "type": "row" },
        {
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 33 }, "id": 40,
          "title": "Node Conditions", "type": "timeseries",
          "fieldConfig": { "defaults": { "color": { "mode": "palette-classic" }, "custom": { "fillOpacity": 10, "lineWidth": 2, "showPoints": "never" } } },
          "options": { "legend": { "calcs": ["lastNotNull"], "displayMode": "table", "placement": "bottom" }, "tooltip": { "mode": "multi" } },
          "targets": [
            { "expr": "sum(kube_node_status_condition{condition=\"Ready\",status=\"true\"}) by (condition)", "legendFormat": "Ready", "refId": "A" },
            { "expr": "sum(kube_node_status_condition{condition=\"MemoryPressure\",status=\"true\"}) by (condition)", "legendFormat": "MemoryPressure", "refId": "B" },
            { "expr": "sum(kube_node_status_condition{condition=\"DiskPressure\",status=\"true\"}) by (condition)", "legendFormat": "DiskPressure", "refId": "C" },
            { "expr": "sum(kube_node_status_condition{condition=\"PIDPressure\",status=\"true\"}) by (condition)", "legendFormat": "PIDPressure", "refId": "D" }
          ]
        },
        {
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 33 }, "id": 41,
          "title": "Terminated Reasons", "type": "timeseries",
          "fieldConfig": { "defaults": { "color": { "mode": "palette-classic" }, "custom": { "fillOpacity": 20, "lineWidth": 2, "showPoints": "never", "stacking": { "mode": "normal" } }, "decimals": 0 } },
          "options": { "legend": { "calcs": ["lastNotNull", "sum"], "displayMode": "table", "placement": "bottom" }, "tooltip": { "mode": "multi" } },
          "targets": [{ "expr": "sum(kube_pod_container_status_last_terminated_reason) by (reason)", "legendFormat": "{{reason}}", "refId": "A" }]
        },

        { "collapsed": false, "gridPos": { "h": 1, "w": 24, "x": 0, "y": 41 }, "id": 600, "title": "HPA & Throttling", "type": "row" },
        {
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 42 }, "id": 50,
          "title": "HPA Current vs Desired", "type": "timeseries",
          "fieldConfig": { "defaults": { "color": { "mode": "palette-classic" }, "custom": { "fillOpacity": 0, "lineWidth": 2, "showPoints": "never" }, "decimals": 0 } },
          "options": { "legend": { "calcs": ["lastNotNull"], "displayMode": "table", "placement": "bottom" }, "tooltip": { "mode": "multi" } },
          "targets": [
            { "expr": "kube_horizontalpodautoscaler_status_current_replicas", "legendFormat": "{{namespace}}/{{horizontalpodautoscaler}} current", "refId": "A" },
            { "expr": "kube_horizontalpodautoscaler_status_desired_replicas", "legendFormat": "{{namespace}}/{{horizontalpodautoscaler}} desired", "refId": "B" }
          ]
        },
        {
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 42 }, "id": 51,
          "title": "CPU Throttling (Top 10 Pods)", "type": "timeseries",
          "fieldConfig": { "defaults": { "unit": "percent", "color": { "mode": "palette-classic" }, "custom": { "fillOpacity": 20, "lineWidth": 2, "showPoints": "never" }, "min": 0 } },
          "options": { "legend": { "calcs": ["mean", "max"], "displayMode": "table", "placement": "bottom" }, "tooltip": { "mode": "multi" } },
          "targets": [{ "expr": "topk(10, sum(increase(container_cpu_cfs_throttled_periods_total{container!=\"\",container!=\"POD\"}[5m])) by (namespace, pod) / sum(increase(container_cpu_cfs_periods_total{container!=\"\",container!=\"POD\"}[5m])) by (namespace, pod) * 100)", "legendFormat": "{{namespace}}/{{pod}}", "refId": "A" }]
        }
      ]
    }
