              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "red", "value": 0.1 }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "id": 19,
          "title": "Memory Working Set per Pod",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 32 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            {
              "expr": "container_memory_working_set_bytes{namespace=\"vendure-production\",container=~\"vendure|vendure-worker\"}",
              "legendFormat": "{{pod}} / {{container}}",
              "refId": "A"
