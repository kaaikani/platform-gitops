        },
        {
          "id": 4,
          "title": "Error Rate",
          "type": "stat",
          "gridPos": { "h": 4, "w": 3, "x": 6, "y": 1 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            {
              "expr": "sum(rate(http_requests_total{namespace=\"vendure-production\",status=~\"5..\"}[5m])) / sum(rate(http_requests_total{namespace=\"vendure-production\"}[5m]))",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "red", "value": 0.01 }
