        },
        {
          "id": 20,
          "title": "System Load",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 32 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            {
              "expr": "node_load1",
              "legendFormat": "{{instance}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "fillOpacity": 10,
                "axisSoftMin": 0
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [{ "color": "green", "value": null }]
              }
            },
            "overrides": []
          }
        },
        {
          "type": "row",
          "title": "Availability & Error Budget",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 40 },
          "id": 21,
          "collapsed": false
        },
        {
          "id": 22,
          "title": "Success Rate Over Time",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 41 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            {
              "expr": "(sum(rate(http_requests_total{namespace=\"vendure-production\"}[5m])) - sum(rate(http_requests_total{namespace=\"vendure-production\",status=~\"5..\"}[5m]))) / sum(rate(http_requests_total{namespace=\"vendure-production\"}[5m]))",
