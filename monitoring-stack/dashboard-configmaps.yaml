              "refId": "A"
            },
            {
              "expr": "0.999",
              "legendFormat": "SLO 99.9%",
              "refId": "B"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "custom": {
                "fillOpacity": 10,
                "axisSoftMin": 0.99,
                "axisSoftMax": 1
              },
              "decimals": 4,
              "thresholds": {
                "mode": "absolute",
                "steps": [{ "color": "green", "value": null }]
              }
            },
            "overrides": [
              {
                "matcher": { "id": "byName", "options": "SLO 99.9%" },
                "properties": [
                  { "id": "custom.lineStyle", "value": { "fill": "dash", "dash": [10, 10] } },
                  { "id": "color", "value": { "mode": "fixed", "fixedColor": "red" } },
                  { "id": "custom.fillOpacity", "value": 0 }
                ]
              }
            ]
          }
        },
        {
          "id": 23,
          "title": "Error Budget Burn Rate",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 41 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            {
              "expr": "sum(rate(http_requests_total{namespace=\"vendure-production\",status=~\"5..\"}[1h])) / sum(rate(http_requests_total{namespace=\"vendure-production\"}[1h])) / (1 - 0.999)",
              "legendFormat": "Burn Rate (1h window)",
              "refId": "A"
            },
            {
              "expr": "sum(rate(http_requests_total{namespace=\"vendure-production\",status=~\"5..\"}[6h])) / sum(rate(http_requests_total{namespace=\"vendure-production\"}[6h])) / (1 - 0.999)",
              "legendFormat": "Burn Rate (6h window)",
              "refId": "B"
