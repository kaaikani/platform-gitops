        },
        {
          "id": 18,
          "title": "CPU Throttling",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 24 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            {
              "expr": "sum by (pod) (rate(container_cpu_cfs_throttled_periods_total{namespace=\"vendure-production\",container=~\"vendure|vendure-worker\"}[5m])) / clamp_min(sum by (pod) (rate(container_cpu_cfs_periods_total{namespace=\"vendure-production\",container=~\"vendure|vendure-worker\"}[5m])), 1)",
              "legendFormat": "{{pod}} / {{container}}",
              "refId": "A"
