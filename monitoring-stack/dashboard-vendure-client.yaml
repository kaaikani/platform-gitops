# =============================================================================
# Grafana Dashboards — Vendure Client (prabhasaaridesigns.com)
# =============================================================================
# Cloned from the existing 'Vendure' dashboards but filtered to the
# vendure-client-production namespace and placed in their own Grafana folder.
#
# Folder: "Vendure - prabhasaaridesigns"
#   - Vendure Backend RED metrics, Node.js runtime, process health, failures
#   - Loki logs (server, worker, K8s events)
# =============================================================================
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-vendure-client-application
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: "Vendure - prabhasaaridesigns"
data:
  vendure-client-application.json: |
    {
      "title": "Vendure - prabhasaaridesigns (Backend)",
      "description": "RED Method + Node.js Runtime + Process Health + Failures",
      "uid": "vendure-client-application",
      "tags": ["vendure", "backend", "production", "prabhasaaridesigns", "vendure-client"],
      "timezone": "Asia/Kolkata",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "time": { "from": "now-6h", "to": "now" },
      "editable": true,
      "graphTooltip": 1,
      "templating": {
        "list": [
          {
            "name": "datasource",
            "type": "datasource",
            "query": "prometheus",
            "current": { "text": "Prometheus", "value": "prometheus" },
            "hide": 0
          }
        ]
      },
      "panels": [
        { "collapsed": false, "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 }, "id": 100, "title": "RED Method Summary", "type": "row" },
        {
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "gridPos": { "h": 4, "w": 3, "x": 0, "y": 1 }, "id": 1,
          "title": "Requests/sec", "type": "stat",
          "fieldConfig": { "defaults": { "unit": "reqps", "color": { "mode": "thresholds" }, "thresholds": { "steps": [{ "color": "green", "value": null }] } } },
          "options": { "colorMode": "background", "graphMode": "area", "reduceOptions": { "calcs": ["lastNotNull"] } },
          "targets": [{ "expr": "sum(rate(vendure_http_requests_total{namespace=\"vendure-client-production\"}[5m]))", "refId": "A" }]
        },
        {
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "gridPos": { "h": 4, "w": 3, "x": 3, "y": 1 }, "id": 2,
          "title": "Error Rate", "type": "stat",
          "fieldConfig": { "defaults": { "unit": "percentunit", "color": { "mode": "thresholds" }, "thresholds": { "steps": [{ "color": "green", "value": null }, { "color": "red", "value": 0.01 }] }, "noValue": "0%" } },
          "options": { "colorMode": "background", "graphMode": "area", "reduceOptions": { "calcs": ["lastNotNull"] } },
          "targets": [{ "expr": "sum(rate(vendure_http_requests_total{namespace=\"vendure-client-production\",status=~\"5..\"}[5m])) / clamp_min(sum(rate(vendure_http_requests_total{namespace=\"vendure-client-production\"}[5m])), 0.001)", "refId": "A" }]
        },
        {
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "gridPos": { "h": 4, "w": 3, "x": 6, "y": 1 }, "id": 3,
          "title": "P95 Latency", "type": "stat",
          "fieldConfig": { "defaults": { "unit": "s", "color": { "mode": "thresholds" }, "thresholds": { "steps": [{ "color": "green", "value": null }, { "color": "yellow", "value": 0.5 }, { "color": "red", "value": 2 }] } } },
          "options": { "colorMode": "background", "graphMode": "area", "reduceOptions": { "calcs": ["lastNotNull"] } },
          "targets": [{ "expr": "histogram_quantile(0.95, sum(rate(vendure_http_request_duration_seconds_bucket{namespace=\"vendure-client-production\"}[5m])) by (le))", "refId": "A" }]
        },
        {
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "gridPos": { "h": 4, "w": 3, "x": 9, "y": 1 }, "id": 4,
          "title": "P99 Latency", "type": "stat",
          "fieldConfig": { "defaults": { "unit": "s", "color": { "mode": "thresholds" }, "thresholds": { "steps": [{ "color": "green", "value": null }, { "color": "yellow", "value": 1 }, { "color": "red", "value": 5 }] } } },
          "options": { "colorMode": "background", "graphMode": "area", "reduceOptions": { "calcs": ["lastNotNull"] } },
          "targets": [{ "expr": "histogram_quantile(0.99, sum(rate(vendure_http_request_duration_seconds_bucket{namespace=\"vendure-client-production\"}[5m])) by (le))", "refId": "A" }]
        },
        {
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "gridPos": { "h": 4, "w": 3, "x": 12, "y": 1 }, "id": 5,
          "title": "Event Loop Lag", "type": "stat",
          "fieldConfig": { "defaults": { "unit": "s", "color": { "mode": "thresholds" }, "thresholds": { "steps": [{ "color": "green", "value": null }, { "color": "yellow", "value": 0.1 }, { "color": "red", "value": 0.5 }] } } },
          "options": { "colorMode": "background", "graphMode": "area", "reduceOptions": { "calcs": ["lastNotNull"] } },
          "targets": [{ "expr": "avg(vendure_nodejs_eventloop_lag_p99_seconds{namespace=\"vendure-client-production\"})", "refId": "A" }]
        },
        {
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "gridPos": { "h": 4, "w": 3, "x": 15, "y": 1 }, "id": 6,
          "title": "Heap Used %", "type": "gauge",
          "fieldConfig": { "defaults": { "unit": "percentunit", "min": 0, "max": 1, "thresholds": { "steps": [{ "color": "green", "value": null }, { "color": "yellow", "value": 0.7 }, { "color": "red", "value": 0.9 }] } } },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] } },
          "targets": [{ "expr": "avg(vendure_nodejs_heap_size_used_bytes{namespace=\"vendure-client-production\"} / vendure_nodejs_heap_size_total_bytes{namespace=\"vendure-client-production\"})", "refId": "A" }]
        },
        {
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "gridPos": { "h": 4, "w": 3, "x": 18, "y": 1 }, "id": 7,
          "title": "Open FDs", "type": "stat",
          "fieldConfig": { "defaults": { "color": { "mode": "thresholds" }, "thresholds": { "steps": [{ "color": "green", "value": null }, { "color": "yellow", "value": 500 }, { "color": "red", "value": 900 }] } } },
          "options": { "colorMode": "background", "graphMode": "area", "reduceOptions": { "calcs": ["lastNotNull"] } },
          "targets": [{ "expr": "avg(process_open_fds{namespace=\"vendure-client-production\"})", "refId": "A" }]
        },
        {
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "gridPos": { "h": 4, "w": 3, "x": 21, "y": 1 }, "id": 8,
          "title": "Running Pods", "type": "stat",
          "fieldConfig": { "defaults": { "color": { "mode": "thresholds" }, "thresholds": { "steps": [{ "color": "red", "value": null }, { "color": "yellow", "value": 1 }, { "color": "green", "value": 2 }] } } },
          "options": { "colorMode": "background", "graphMode": "none", "reduceOptions": { "calcs": ["lastNotNull"] } },
          "targets": [{ "expr": "count(kube_pod_status_phase{namespace=\"vendure-client-production\", phase=\"Running\"} == 1)", "refId": "A" }]
        },
    
        { "collapsed": false, "gridPos": { "h": 1, "w": 24, "x": 0, "y": 5 }, "id": 200, "title": "API Traffic — RED", "type": "row" },
        {
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 6 }, "id": 10,
          "title": "Request Rate by Route", "type": "timeseries",
          "fieldConfig": { "defaults": { "unit": "reqps", "color": { "mode": "palette-classic" }, "custom": { "fillOpacity": 20, "lineWidth": 2, "showPoints": "never", "stacking": { "mode": "normal" } } } },
          "options": { "legend": { "calcs": ["mean", "max", "lastNotNull"], "displayMode": "table", "placement": "bottom" }, "tooltip": { "mode": "multi" } },
          "targets": [{ "expr": "sum(rate(vendure_http_requests_total{namespace=\"vendure-client-production\"}[5m])) by (route)", "legendFormat": "{{route}}", "refId": "A" }]
        },
        {
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 6 }, "id": 11,
          "title": "HTTP Status Codes", "type": "timeseries",
          "fieldConfig": {
            "defaults": { "unit": "reqps", "color": { "mode": "palette-classic" }, "custom": { "fillOpacity": 30, "lineWidth": 2, "showPoints": "never", "stacking": { "mode": "normal" } } },
            "overrides": [
              { "matcher": { "id": "byRegexp", "options": "2.." }, "properties": [{ "id": "color", "value": { "fixedColor": "green", "mode": "fixed" } }] },
              { "matcher": { "id": "byRegexp", "options": "4.." }, "properties": [{ "id": "color", "value": { "fixedColor": "yellow", "mode": "fixed" } }] },
              { "matcher": { "id": "byRegexp", "options": "5.." }, "properties": [{ "id": "color", "value": { "fixedColor": "red", "mode": "fixed" } }] }
            ]
          },
          "options": { "legend": { "calcs": ["mean", "max"], "displayMode": "table", "placement": "bottom" }, "tooltip": { "mode": "multi" } },
          "targets": [{ "expr": "sum(rate(vendure_http_requests_total{namespace=\"vendure-client-production\"}[5m])) by (status)", "legendFormat": "{{status}}", "refId": "A" }]
        },
    
        { "collapsed": false, "gridPos": { "h": 1, "w": 24, "x": 0, "y": 14 }, "id": 300, "title": "Latency", "type": "row" },
        {
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 15 }, "id": 20,
          "title": "Latency Percentiles", "type": "timeseries",
          "fieldConfig": { "defaults": { "unit": "s", "color": { "mode": "palette-classic" }, "custom": { "fillOpacity": 10, "lineWidth": 2, "showPoints": "never" } } },
          "options": { "legend": { "calcs": ["mean", "max"], "displayMode": "table", "placement": "bottom" }, "tooltip": { "mode": "multi" } },
          "targets": [
            { "expr": "histogram_quantile(0.50, sum(rate(vendure_http_request_duration_seconds_bucket{namespace=\"vendure-client-production\"}[5m])) by (le))", "legendFormat": "p50", "refId": "A" },
            { "expr": "histogram_quantile(0.90, sum(rate(vendure_http_request_duration_seconds_bucket{namespace=\"vendure-client-production\"}[5m])) by (le))", "legendFormat": "p90", "refId": "B" },
            { "expr": "histogram_quantile(0.95, sum(rate(vendure_http_request_duration_seconds_bucket{namespace=\"vendure-client-production\"}[5m])) by (le))", "legendFormat": "p95", "refId": "C" },
            { "expr": "histogram_quantile(0.99, sum(rate(vendure_http_request_duration_seconds_bucket{namespace=\"vendure-client-production\"}[5m])) by (le))", "legendFormat": "p99", "refId": "D" }
          ]
        },
        {
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 15 }, "id": 21,
          "title": "P95 Latency by Route", "type": "timeseries",
          "fieldConfig": { "defaults": { "unit": "s", "color": { "mode": "palette-classic" }, "custom": { "fillOpacity": 10, "lineWidth": 2, "showPoints": "never" } } },
          "options": { "legend": { "calcs": ["mean", "max"], "displayMode": "table", "placement": "bottom" }, "tooltip": { "mode": "multi" } },
          "targets": [{ "expr": "histogram_quantile(0.95, sum(rate(vendure_http_request_duration_seconds_bucket{namespace=\"vendure-client-production\"}[5m])) by (le, route))", "legendFormat": "{{route}}", "refId": "A" }]
        },
    
        { "collapsed": false, "gridPos": { "h": 1, "w": 24, "x": 0, "y": 23 }, "id": 400, "title": "Node.js Runtime", "type": "row" },
        {
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 24 }, "id": 30,
          "title": "Event Loop Lag", "type": "timeseries",
          "fieldConfig": { "defaults": { "unit": "s", "color": { "mode": "palette-classic" }, "custom": { "fillOpacity": 10, "lineWidth": 2, "showPoints": "never" } } },
          "options": { "legend": { "calcs": ["mean", "max"], "displayMode": "table", "placement": "bottom" }, "tooltip": { "mode": "multi" } },
          "targets": [
            { "expr": "vendure_nodejs_eventloop_lag_p50_seconds{namespace=\"vendure-client-production\"}", "legendFormat": "{{pod}} p50", "refId": "A" },
            { "expr": "vendure_nodejs_eventloop_lag_p99_seconds{namespace=\"vendure-client-production\"}", "legendFormat": "{{pod}} p99", "refId": "B" }
          ]
        },
        {
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 24 }, "id": 31,
          "title": "Heap Memory", "type": "timeseries",
          "fieldConfig": { "defaults": { "unit": "bytes", "color": { "mode": "palette-classic" }, "custom": { "fillOpacity": 20, "lineWidth": 2, "showPoints": "never" } } },
          "options": { "legend": { "calcs": ["mean", "max", "lastNotNull"], "displayMode": "table", "placement": "bottom" }, "tooltip": { "mode": "multi" } },
          "targets": [
            { "expr": "vendure_nodejs_heap_size_used_bytes{namespace=\"vendure-client-production\"}", "legendFormat": "{{pod}} used", "refId": "A" },
            { "expr": "vendure_nodejs_heap_size_total_bytes{namespace=\"vendure-client-production\"}", "legendFormat": "{{pod}} total", "refId": "B" }
          ]
        },
        {
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 32 }, "id": 32,
          "title": "Active Connections & Handles", "type": "timeseries",
          "fieldConfig": { "defaults": { "color": { "mode": "palette-classic" }, "custom": { "fillOpacity": 10, "lineWidth": 2, "showPoints": "never" } } },
          "options": { "legend": { "calcs": ["mean", "max", "lastNotNull"], "displayMode": "table", "placement": "bottom" }, "tooltip": { "mode": "multi" } },
          "targets": [
            { "expr": "vendure_nodejs_active_resources{namespace=\"vendure-client-production\",type=\"TCPSocketWrap\"}", "legendFormat": "{{pod}} TCP", "refId": "A" },
            { "expr": "vendure_nodejs_active_resources_total{namespace=\"vendure-client-production\"}", "legendFormat": "{{pod}} total handles", "refId": "B" }
          ]
        },
    
        { "collapsed": false, "gridPos": { "h": 1, "w": 24, "x": 0, "y": 40 }, "id": 500, "title": "Process Health", "type": "row" },
        {
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "gridPos": { "h": 8, "w": 8, "x": 0, "y": 41 }, "id": 40,
          "title": "Process CPU", "type": "timeseries",
          "fieldConfig": { "defaults": { "color": { "mode": "palette-classic" }, "custom": { "fillOpacity": 20, "lineWidth": 2, "showPoints": "never" } } },
          "options": { "legend": { "calcs": ["mean", "max"], "displayMode": "table", "placement": "bottom" }, "tooltip": { "mode": "multi" } },
          "targets": [{ "expr": "rate(process_cpu_seconds_total{namespace=\"vendure-client-production\"}[5m])", "legendFormat": "{{pod}}", "refId": "A" }]
        },
        {
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "gridPos": { "h": 8, "w": 8, "x": 8, "y": 41 }, "id": 41,
          "title": "Process RSS Memory", "type": "timeseries",
          "fieldConfig": { "defaults": { "unit": "bytes", "color": { "mode": "palette-classic" }, "custom": { "fillOpacity": 20, "lineWidth": 2, "showPoints": "never" } } },
          "options": { "legend": { "calcs": ["mean", "max", "lastNotNull"], "displayMode": "table", "placement": "bottom" }, "tooltip": { "mode": "multi" } },
          "targets": [{ "expr": "process_resident_memory_bytes{namespace=\"vendure-client-production\"}", "legendFormat": "{{pod}}", "refId": "A" }]
        },
        {
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "gridPos": { "h": 8, "w": 8, "x": 16, "y": 41 }, "id": 42,
          "title": "Open File Descriptors", "type": "timeseries",
          "fieldConfig": { "defaults": { "color": { "mode": "palette-classic" }, "custom": { "fillOpacity": 10, "lineWidth": 2, "showPoints": "never" } } },
          "options": { "legend": { "calcs": ["mean", "max", "lastNotNull"], "displayMode": "table", "placement": "bottom" }, "tooltip": { "mode": "multi" } },
          "targets": [{ "expr": "process_open_fds{namespace=\"vendure-client-production\"}", "legendFormat": "{{pod}}", "refId": "A" }]
        },
    
        { "collapsed": false, "gridPos": { "h": 1, "w": 24, "x": 0, "y": 49 }, "id": 600, "title": "Failures", "type": "row" },
        {
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 50 }, "id": 50,
          "title": "Pod Restarts", "type": "timeseries",
          "fieldConfig": { "defaults": { "color": { "mode": "palette-classic" }, "custom": { "fillOpacity": 30, "lineWidth": 2, "showPoints": "always", "drawStyle": "bars" }, "decimals": 0 } },
          "options": { "legend": { "calcs": ["sum"], "displayMode": "table", "placement": "bottom" }, "tooltip": { "mode": "multi" } },
          "targets": [{ "expr": "increase(kube_pod_container_status_restarts_total{namespace=\"vendure-client-production\"}[1h])", "legendFormat": "{{pod}} ({{container}})", "refId": "A" }]
        },
        {
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 50 }, "id": 51,
          "title": "CrashLoop & OOMKill Events", "type": "timeseries",
          "fieldConfig": { "defaults": { "color": { "mode": "palette-classic" }, "custom": { "fillOpacity": 20, "lineWidth": 2, "showPoints": "never", "stacking": { "mode": "normal" } }, "decimals": 0 } },
          "options": { "legend": { "calcs": ["lastNotNull", "sum"], "displayMode": "table", "placement": "bottom" }, "tooltip": { "mode": "multi" } },
          "targets": [
            { "expr": "sum(kube_pod_container_status_waiting_reason{namespace=\"vendure-client-production\",reason=\"CrashLoopBackOff\"}) by (pod)", "legendFormat": "CrashLoop: {{pod}}", "refId": "A" },
            { "expr": "sum(kube_pod_container_status_last_terminated_reason{namespace=\"vendure-client-production\",reason=\"OOMKilled\"}) by (pod)", "legendFormat": "OOMKilled: {{pod}}", "refId": "B" }
          ]
        }
      ]
    }
---
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vendure-client-logs-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: "Vendure - prabhasaaridesigns"
data:
  vendure-client-logs.json: |
    {
      "title": "Vendure - prabhasaaridesigns (Logs)",
      "description": "Live Loki logs for prabhasaaridesigns Vendure server and worker — errors, warnings, info",
      "uid": "vendure-client-logs",
      "tags": ["vendure", "logs", "loki"],
      "timezone": "Asia/Kolkata",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "time": { "from": "now-1h", "to": "now" },
      "editable": true,
      "graphTooltip": 1,
      "templating": {
        "list": [
          {
            "name": "loki_ds",
            "type": "datasource",
            "query": "loki",
            "hide": 0,
            "includeAll": false,
            "multi": false,
            "current": { "text": "Loki", "value": "loki" }
          },
          {
            "name": "container",
            "type": "query",
            "datasource": { "type": "loki", "uid": "${loki_ds}" },
            "query": "label_values({namespace=\"vendure-client-production\"}, container)",
            "hide": 0,
            "includeAll": true,
            "multi": true,
            "current": {},
            "refresh": 2
          },
          {
            "name": "level",
            "type": "custom",
            "hide": 0,
            "includeAll": true,
            "multi": true,
            "options": [
              { "text": "error", "value": "error" },
              { "text": "warn",  "value": "warn"  },
              { "text": "info",  "value": "info"  }
            ],
            "current": {}
          }
        ]
      },
      "panels": [
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 },
          "id": 100,
          "title": "Log Volume",
          "type": "row"
        },
        {
          "datasource": { "type": "loki", "uid": "${loki_ds}" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": { "fillOpacity": 20, "lineWidth": 1, "stacking": { "mode": "normal" } }
            },
            "overrides": [
              { "matcher": { "id": "byName", "options": "error" }, "properties": [{ "id": "color", "value": { "fixedColor": "red", "mode": "fixed" } }] },
              { "matcher": { "id": "byName", "options": "warn"  }, "properties": [{ "id": "color", "value": { "fixedColor": "orange", "mode": "fixed" } }] },
              { "matcher": { "id": "byName", "options": "info"  }, "properties": [{ "id": "color", "value": { "fixedColor": "blue", "mode": "fixed" } }] }
            ]
          },
          "gridPos": { "h": 6, "w": 24, "x": 0, "y": 1 },
          "id": 1,
          "options": {
            "legend": { "calcs": ["sum"], "displayMode": "table", "placement": "right" },
            "tooltip": { "mode": "multi" }
          },
          "title": "Log rate by level (vendure-client-production)",
          "type": "timeseries",
          "targets": [
            {
              "datasource": { "type": "loki", "uid": "${loki_ds}" },
              "expr": "sum by (level) (rate({namespace=\"vendure-client-production\", container=~\"$container\"}[5m]))",
              "legendFormat": "{{level}}",
              "refId": "A"
            }
          ]
        },
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 7 },
          "id": 101,
          "title": "Vendure Server Logs",
          "type": "row"
        },
        {
          "datasource": { "type": "loki", "uid": "${loki_ds}" },
          "gridPos": { "h": 12, "w": 24, "x": 0, "y": 8 },
          "id": 2,
          "options": {
            "dedupStrategy": "none",
            "enableLogDetails": true,
            "prettifyLogMessage": false,
            "showCommonLabels": false,
            "showLabels": false,
            "showTime": true,
            "sortOrder": "Descending",
            "wrapLogMessage": true
          },
          "title": "Vendure Server — All Logs",
          "type": "logs",
          "targets": [
            {
              "datasource": { "type": "loki", "uid": "${loki_ds}" },
              "expr": "{namespace=\"vendure-client-production\", container=\"vendure\"}",
              "refId": "A"
            }
          ]
        },
