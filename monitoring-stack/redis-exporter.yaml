# =============================================================================
# Redis exporter -> external Redis Cloud (powers the "Redis Cache" dashboard)
# =============================================================================
# Scrapes the managed Redis Cloud instance Vendure uses (REDIS_HOST/PORT from
# AWS Secrets Manager via the exporter-credentials secret) and exposes redis_*
# metrics. Deployed by the monitoring-dashboards ArgoCD app (monitoring-stack/*).
#
# NOTE: addr scheme is redis:// (non-TLS). If the Redis Cloud endpoint requires
# TLS, change --redis.addr to rediss:// .
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-exporter
  namespace: monitoring
  labels:
    app: redis-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis-exporter
  template:
    metadata:
      labels:
        app: redis-exporter
    spec:
      containers:
        - name: redis-exporter
          image: oliver006/redis_exporter:v1.66.0
          args:
            - "--redis.addr=redis://$(REDIS_HOST):$(REDIS_PORT)"
          env:
            - name: REDIS_HOST
              valueFrom:
                secretKeyRef: { name: exporter-credentials, key: REDIS_HOST }
            - name: REDIS_PORT
              valueFrom:
                secretKeyRef: { name: exporter-credentials, key: REDIS_PORT }
            - name: REDIS_USER
              valueFrom:
                secretKeyRef: { name: exporter-credentials, key: REDIS_USERNAME }
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef: { name: exporter-credentials, key: REDIS_PASSWORD }
          ports:
            - { name: metrics, containerPort: 9121 }
          resources:
            requests: { cpu: 10m, memory: 24Mi }
            limits: { cpu: 50m, memory: 64Mi }
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 59000
            capabilities: { drop: ["ALL"] }
---
apiVersion: v1
kind: Service
metadata:
  name: redis-exporter
  namespace: monitoring
  labels:
    app: redis-exporter
spec:
  selector:
    app: redis-exporter
  ports:
    - { name: metrics, port: 9121, targetPort: metrics }
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: redis-exporter
  namespace: monitoring
  labels:
    release: prometheus-stack
spec:
  selector:
    matchLabels:
      app: redis-exporter
  endpoints:
    - port: metrics
      interval: 30s
